<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#FBF4E9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>听写小助手 V6 · 阿涛</title>
    <style>
        :root { --bg: #FBF4E9; --card: #FFF; --text: #3B2F2A; --muted: #8A7A6D; --line: #ECE0CF; --accent: #E8743B; --zh: #3FB37F; --en: #4A90D9; --danger: #D9534F; --shadow: 0 6px 20px rgba(120,90,50,.10); --radius: 16px; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; font-size: 16px; padding: 16px; padding-bottom: calc(24px + env(safe-area-inset-bottom)); max-width: 760px; margin: 0 auto; min-height: 100vh; }
        header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 8px; flex-wrap: wrap; }
        .brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
        .brand h1 { font-size: 21px; font-weight: 800; white-space: nowrap; }
        .ver { font-size: 11px; font-weight: 700; background: var(--accent); color: #fff; border-radius: 999px; padding: 2px 8px; margin-left: 6px; }
        .brand .logo { width: 34px; height: 34px; flex: 0 0 34px; }
        .tabs { display: flex; gap: 4px; margin-bottom: 14px; background: #fff; border-radius: 12px; padding: 4px; border: 1px solid var(--line); }
        .tab-btn { flex: 1; padding: 9px 0; border: none; background: transparent; border-radius: 9px; font-size: 14px; font-weight: 700; color: var(--muted); cursor: pointer; transition: .15s; }
        .tab-btn.active { background: var(--accent); color: #fff; box-shadow: 0 2px 8px rgba(232,116,59,.3); }
        .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin-bottom: 16px; border: 1px solid var(--line); }
        .card h2 { font-size: 17px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
        .card h2 .ico { width: 22px; height: 22px; flex: 0 0 22px; }
        .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-row.nowrap { flex-wrap: nowrap; }
        .btn-row.nowrap .big-btn:first-child { flex: 1; min-width: 0; }
        .btn-row.nowrap .big-btn:last-child { flex: 0 0 auto; min-width: 72px; padding: 0 14px; font-size: 14px; }
        .big-btn { flex: 1; min-width: 140px; min-height: 52px; border: none; border-radius: 14px; font-size: 17px; font-weight: 800; color: #fff; background: var(--accent); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 12px rgba(232,116,59,.35); transition: transform .05s; }
        .big-btn:active { transform: scale(.97); }
        .big-btn.ghost { background: #fff; color: var(--accent); border: 2px solid var(--accent); box-shadow: none; }
        .big-btn.small { flex: 0 0 auto; min-width: auto; padding: 0 16px; font-size: 14px; }
        .mini-btn { border: 1.5px solid var(--line); background: #fff; color: var(--text); border-radius: 10px; padding: 10px 14px; font-size: 14px; font-weight: 700; cursor: pointer; min-height: 44px; transition: transform .05s; }
        .mini-btn:active { transform: scale(.97); }
        .mini-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
        .set-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
        .set-item label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 4px; }
        .set-item .val { font-weight: 700; }
        input[type=range] { width: 100%; accent-color: var(--accent); }
        .toggle { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-top: 2px; }
        .toggle input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
        select, input[type=text], textarea { width: 100%; font-size: 16px; padding: 11px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; color: var(--text); font-family: inherit; }
        /* 修改：减小右侧内边距，让文字能铺满 */
        textarea { min-height: 96px; resize: vertical; padding-right: 30px; }
        .textarea-wrapper { position: relative; display: block; }
        /* 修改：缩小拖动条尺寸 */
        .textarea-wrapper .resize-handle {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 28px;
            height: 28px;
            cursor: ns-resize;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: var(--muted);
            background: rgba(255,255,255,0.85);
            border-left: 1px solid var(--line);
            border-top: 1px solid var(--line);
            border-radius: 6px 0 0 0;
            user-select: none;
            -webkit-user-select: none;
            line-height: 1;
            pointer-events: auto;
            transition: background .15s;
        }
        .textarea-wrapper .resize-handle:active { background: var(--accent); color: #fff; }
        .group-bar { display: flex; gap: 8px; flex-wrap: nowrap; align-items: center; margin-bottom: 12px; overflow-x: auto; }
        .group-bar select { flex: 1; min-width: 80px; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; font-size: 15px; font-weight: 600; color: var(--text); }
        .group-bar .mini-btn { flex: 0 0 auto; min-height: 40px; padding: 6px 12px; font-size: 13px; white-space: nowrap; }
        .group-bar .mini-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
        .word-list { margin-top: 6px; display: flex; flex-direction: column; gap: 8px; }
        .empty { text-align: center; color: var(--muted); padding: 26px 10px; font-size: 14px; }
        .word-item { display: flex; align-items: center; gap: 6px; background: #FFFDF9; border: 1px solid var(--line); border-radius: 12px; padding: 6px 8px; transition: box-shadow .15s; }
        .word-item.highlight { box-shadow: 0 0 0 2px var(--accent); }
        .wi-main { flex: 1; min-width: 0; }
        .wi-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .wi-text { font-size: 18px; font-weight: 800; word-break: break-all; }
        .wi-text.en { font-style: italic; }
        .tag { font-size: 10px; font-weight: 700; color: #fff; border-radius: 999px; padding: 1px 8px; flex-shrink: 0; }
        .tag.zh { background: var(--zh); }
        .tag.en { background: var(--en); }
        .wi-note { font-size: 13px; color: var(--muted); margin-top: 1px; word-break: break-all; }
        .wi-actions { display: flex; gap: 4px; flex: 0 0 auto; }
        .icon-btn { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform .05s; padding: 0; flex-shrink: 0; }
        .icon-btn:active { transform: scale(.92); }
        .icon-btn.play { background: var(--accent); border-color: var(--accent); }
        .icon-btn.play svg { stroke: #fff; }
        .icon-btn svg { width: 17px; height: 17px; stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .icon-btn.del svg { stroke: var(--danger); }
        .icon-btn.edit svg { stroke: var(--en); }
        .wi-handle { flex: 0 0 auto; width: 28px; display: flex; align-items: center; justify-content: center; color: #C2B2A2; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
        .wi-handle:active { cursor: grabbing; color: var(--accent); }
        .wi-handle svg { width: 18px; height: 18px; fill: currentColor; stroke: none; }
        .edit-box { display: none; margin-top: 6px; background: #FCF6EC; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; gap: 6px; flex-wrap: wrap; }
        .edit-box.show { display: flex; }
        .edit-box input, .edit-box select { flex: 1; min-width: 70px; font-size: 14px; padding: 6px 8px; border: 1.5px solid var(--line); border-radius: 8px; background: #fff; }
        .toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(20px); background: rgba(59,47,42,.94); color: #fff; padding: 11px 18px; border-radius: 12px; font-size: 14px; opacity: 0; pointer-events: none; transition: .25s; z-index: 50; max-width: 88%; text-align: center; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .now-playing { margin-top: 14px; display: none; text-align: center; }
        .now-playing.show { display: block; }
        .np-word { font-size: 30px; font-weight: 800; color: var(--accent); min-height: 38px; word-break: break-all; }
        .np-prog { font-size: 13px; color: var(--muted); margin-top: 4px; }
        .crop-overlay { position: fixed; inset: 0; z-index: 1000; background: #f0ebe3; display: none; flex-direction: column; touch-action: none; }
        .crop-overlay.open { display: flex; }
        .overlay-body { flex: 1; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: visible; padding: 8px 0; }
        .overlay-body canvas { display: block; max-width: 100%; max-height: 76vh; touch-action: none; user-select: none; -webkit-user-select: none; border-radius: 4px; box-shadow: 0 4px 30px rgba(0,0,0,.15); image-rendering: auto; }
        .overlay-hint { color: rgba(0,0,0,.6); font-size: 13px; margin-top: 8px; text-align: center; padding: 0 16px; }
        .overlay-footer { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; flex-shrink: 0; background: rgba(255,255,255,.72); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); gap: 12px; flex-wrap: wrap; }
        .confirm-btn { flex: 1; min-width: 120px; padding: 12px 24px; background: var(--accent); border: none; border-radius: 12px; color: #fff; font-size: 17px; font-weight: 700; cursor: pointer; transition: transform .05s; box-shadow: 0 4px 16px rgba(232,116,59,.4); text-align: center; }
        .confirm-btn:active { transform: scale(.96); }
        .confirm-btn:disabled { opacity: .6; cursor: not-allowed; }
        .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .modal-mask.show { display: flex; }
        .modal { background: #fff; border-radius: 16px; padding: 20px; max-width: 340px; width: 100%; box-shadow: var(--shadow); }
        .modal h3 { margin: 0 0 10px; font-size: 17px; }
        .modal p { margin: 0 0 10px; color: var(--muted); font-size: 14px; white-space: pre-wrap; }
        .modal input[type=text] { width: 100%; padding: 10px 12px; font-size: 16px; border: 1.5px solid var(--line); border-radius: 10px; margin-bottom: 12px; }
        .modal .btn-row { flex-direction: row; gap: 10px; }
        .modal .mini-btn { flex: 1; min-width: 0; }
        .voice-dot { width: 8px; height: 8px; border-radius: 50%; background: #22C55E; display: inline-block; flex-shrink: 0; }
        .voice-dot.err { background: var(--danger); }
        .voice-selector { display: flex; align-items: center; gap: 4px; background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 5px 10px; font-size: 13px; font-weight: 600; color: var(--text); cursor: pointer; min-width: 72px; }
        .voice-selector select { border: none; background: transparent; font-size: 13px; font-weight: 600; color: var(--text); outline: none; padding: 0; font-family: inherit; cursor: pointer; width: auto; appearance: auto; -webkit-appearance: auto; }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
        .backup { display: flex; gap: 10px; flex-wrap: wrap; }
        .backup .mini-btn { flex: 1; min-width: 120px; }
        .danger-zone { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 12px; }
        .stat-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 14px; }
        .stat-card { background: #FFFDF9; border: 1px solid var(--line); border-radius: 12px; padding: 12px 10px; text-align: center; }
        .stat-num { font-size: 28px; font-weight: 800; color: var(--accent); line-height: 1; }
        .stat-lab { font-size: 12px; color: var(--muted); margin-top: 4px; }
        .chart-wrap { background: #FFFDF9; border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
        .chart-wrap canvas { width: 100%; height: 140px; display: block; }
        .history-list { max-height: 200px; overflow-y: auto; margin-top: 8px; }
        .history-item { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
        .history-item:last-child { border-bottom: none; }
        .hi-time { color: var(--muted); flex: 0 0 60px; font-size: 11px; }
        .hi-score { font-weight: 700; padding: 2px 8px; border-radius: 999px; font-size: 12px; }
        .hi-score.good { background: #DCFCE7; color: #166534; }
        .hi-score.avg { background: #FEF3C7; color: #92400E; }
        .hi-score.poor { background: #FEE2E2; color: #991B1B; }
        .ocr-result { display: none; margin-top: 8px; font-size: 14px; color: var(--accent); }
        .ocr-result.show { display: block; }
        .enhance-check { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--text); }
        .enhance-check input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
        @media(max-width:560px) {
            body { padding: 12px; font-size: 16px; }
            .set-grid { grid-template-columns: 1fr; }
            .brand h1 { font-size: 19px; }
            .word-item { padding: 5px 6px; }
            .wi-text { font-size: 17px; }
            .icon-btn { width: 32px; height: 32px; }
            .icon-btn svg { width: 16px; height: 16px; }
            .group-bar select { min-width: 60px; font-size: 14px; }
            .group-bar .mini-btn { font-size: 12px; padding: 4px 10px; min-height: 34px; }
            .overlay-body canvas { max-height: 66vh; }
            .overlay-footer { padding: 10px 12px; flex-wrap: wrap; gap: 8px; }
            .confirm-btn { font-size: 15px; padding: 10px 16px; }
            .stat-grid { grid-template-columns: repeat(3,1fr); gap: 6px; }
            .stat-num { font-size: 22px; }
            .voice-selector { padding: 3px 8px; font-size: 12px; min-width: 80px; }
            .voice-selector select { font-size: 12px; width: auto; }
            .textarea-wrapper .resize-handle { width: 24px; height: 24px; font-size: 14px; }
        }
        @media(max-width:380px) {
            .btn-row { flex-direction: column; }
            .btn-row.nowrap { flex-wrap: wrap; }
            .btn-row.nowrap .big-btn:first-child { flex: 1 1 100%; min-width: 100%; }
            .btn-row.nowrap .big-btn:last-child { flex: 1 1 100%; min-width: 100%; }
            .group-bar { flex-wrap: wrap; }
            .modal .btn-row { flex-direction: column; }
            header { flex-wrap: wrap; }
            .big-btn.small { flex: 1; }
            .overlay-footer { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <svg class="logo" viewBox="0 0 24 24" fill="none">
                <rect x="3" y="4" width="18" height="16" rx="3" fill="#FBF4E9" stroke="#E8743B" stroke-width="1.6"/>
                <path d="M8 9h8M8 13h5" stroke="#E8743B" stroke-width="1.8" stroke-linecap="round"/>
                <circle cx="17.5" cy="16.5" r="3" fill="#E8743B"/>
                <path d="M19.6 18.6L22 21" stroke="#E8743B" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <h1>听写小助手 <span class="ver">V6 · 阿涛</span></h1>
        </div>
        <div class="voice-selector" id="voiceSelector">
            <span class="voice-dot" id="voiceDot"></span>
            <select id="voiceEngineSelect" title="语音引擎">
                <option value="auto">自动</option>
                <option value="system">内置</option>
                <option value="online">在线</option>
            </select>
        </div>
    </header>
    <div class="tabs">
        <button class="tab-btn active" data-tab="dictation">🎧 听写</button>
        <button class="tab-btn" data-tab="wordbank">📚 词库</button>
        <button class="tab-btn" data-tab="stats">📊 统计</button>
    </div>
    <div class="tab-panel active" id="tab-dictation">
        <section class="card today">
            <h2><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#E8743B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v2M12 19v2M5 12H3M21 12h-2"/><circle cx="12" cy="12" r="6"/></svg>今日听写</h2>
            <div class="stat"><span class="num" id="wordCount">0</span><span class="lab">个词语待听写</span></div>
            <div class="sub" style="color:var(--muted);font-size:13px;margin-bottom:14px">点「开始听写」按顺序朗读，每个词循环 <span id="loopLabel">2</span> 遍；也可单独点喇叭发音。</div>
            <div class="btn-row nowrap">
                <button class="big-btn" id="startBtn"><svg viewBox="0 0 24 24" fill="#fff" style="width:22px;height:22px"><path d="M8 5v14l11-7z"/></svg>开始听写</button>
                <button class="big-btn ghost small" id="shuffleBtn" style="font-size:14px;min-width:72px;padding:0 14px;flex:0 0 auto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>随机</button>
            </div>
            <div class="btn-row" style="margin-top:10px">
                <button class="big-btn ghost" id="scanBtn" style="font-size:15px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>拍照导入词语</button>
            </div>
            <div class="now-playing" id="nowPlaying">
                <div class="np-word" id="npWord"></div>
                <div class="np-prog" id="npProg"></div>
            </div>
            <div class="settings" style="margin-top:16px;border-top:1px dashed var(--line);padding-top:14px">
                <div class="set-grid">
                    <div class="set-item"><label>循环次数：<span class="val" id="loopVal">2</span> 遍</label><input type="range" id="loopRange" min="1" max="5" step="1" value="2"></div>
                    <div class="set-item"><label>语速：<span class="val" id="rateVal">0.9</span></label><input type="range" id="rateRange" min="0.5" max="1.5" step="0.1" value="0.9"></div>
                    <div class="set-item"><label>词内停顿：<span class="val" id="gapVal">0.9</span>s</label><input type="range" id="gapRange" min="0.3" max="5" step="0.1" value="0.9"></div>
                    <div class="set-item"><label>词间停顿：<span class="val" id="pauseVal">1.2</span>s</label><input type="range" id="pauseRange" min="0.3" max="15" step="0.1" value="1.2"></div>
                </div>
                <label class="toggle" style="margin-top:10px"><input type="checkbox" id="showNote" checked> 朗读时显示释义提示</label>
            </div>
        </section>
    </div>
    <div class="tab-panel" id="tab-wordbank">
        <section class="card">
            <h2><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#E8743B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>词库管理</h2>
            <div class="group-bar">
                <select id="groupSelector"></select>
                <button class="mini-btn primary" id="addGroupBtn">+ 新课</button>
                <button class="mini-btn" id="delGroupBtn" style="color:var(--danger);border-color:#f0c9c7;flex-shrink:0">删除本课</button>
            </div>
            <label style="font-size:13px;color:var(--text);display:block;margin-bottom:4px">📝 批量导入（每行一个，<code style="font-size:12px;color:var(--muted)">|</code> 分隔释义）</label>
            <div class="textarea-wrapper">
                <textarea id="importArea" placeholder="例如：&#10;春天&#10;school&#10;teacher | 老师"></textarea>
                <div class="resize-handle" id="resizeHandle" title="拖动调整高度">⤡</div>
            </div>
            <div class="btn-row" style="margin-top:10px">
                <button class="big-btn ghost" id="importBtn" style="font-size:16px">导入到词库</button>
                <button class="big-btn" id="clearImportBtn" style="font-size:16px;background:#fff;color:var(--muted);border:1.5px solid var(--line);box-shadow:none">清空</button>
            </div>
            <div style="height:12px"></div>
            <div class="word-list" id="wordList"></div>
        </section>
        <section class="card">
            <h2><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#E8743B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 109 9"/><path d="M12 7v5l3 2"/></svg>备份与设置</h2>
            <div class="backup">
                <button class="mini-btn" id="exportBtn" style="flex:1;min-width:120px">导出 JSON 备份</button>
                <button class="mini-btn" id="importJsonBtn" style="flex:1;min-width:120px">导入恢复</button>
                <input type="file" id="importFile" accept="application/json" style="display:none">
            </div>
            <div class="danger-zone" style="margin-top:12px">
                <div class="backup">
                    <button class="mini-btn" id="clearSampleBtn" style="flex:1;min-width:110px">重置示例</button>
                    <button class="mini-btn" id="clearAllBtn" style="flex:1;min-width:110px;color:var(--danger);border-color:#f0c9c7">清空全部</button>
                </div>
                <div class="warn" id="warnBox"></div>
            </div>
        </section>
    </div>
    <div class="tab-panel" id="tab-stats">
        <section class="card">

            <div class="stat-grid">
                <div class="stat-card"><div class="stat-num" id="statTotal">0</div><div class="stat-lab">总听写次数</div></div>
                <div class="stat-card"><div class="stat-num" id="statAvgAcc">--%</div><div class="stat-lab">平均正确率</div></div>

    </div>
    <div class="crop-overlay" id="cropOverlay">

            </label>

    </div>
    <div class="modal-mask" id="inputModalMask"><div class="modal"><h3 id="inputModalTitle">输入</h3><p id="inputModalDesc"></p><input type="text" id="inputModalInput" placeholder="请输入…"><div class="btn-row"><button class="mini-btn primary" id="inputModalOk">确定</button><button class="mini-btn" id="inputModalCancel">取消</button></div></div></div>
    <div class="modal-mask" id="confirmModalMask"><div class="modal"><h3 id="confirmModalTitle">确认</h3><p id="confirmModalText"></p><div class="btn-row"><button class="mini-btn primary" id="confirmModalOk">确定</button><button class="mini-btn" id="confirmModalCancel">取消</button></div></div></div>
    <input type="file" id="albumInput" accept="image/*" style="display:none">
    <!-- 本地 Tesseract 已禁用（避免 cdn.jsdelivr.net 国内访问不稳 + wasm 大包加载卡死），改用 OCR.space 云端 -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" onerror="window._tessLoadFailed=true"></script>
    <script>
        "use strict";
        function $(id) { return document.getElementById(id); }
        function isZh(t) { return /[\u4e00-\u9fff\u3400-\u4dbf]/.test(t); }
        function detectLang(t) { return isZh(t) ? 'zh' : 'en'; }
        function genId() { return 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
        function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' } [c])); }
        function langText(l) { return l === 'en' ? 'EN' : '中文'; }
        let _toastTimer;
        function toast(msg, duration = 2200) { const t = $('toast'); if (!t) return; t.textContent = msg; t.classList.add('show'); clearTimeout(_toastTimer); _toastTimer = setTimeout(() => t.classList.remove('show'), duration); }
        (function() { if (!$('toast')) { const d = document.createElement('div'); d.id = 'toast'; d.className = 'toast'; document.body.appendChild(d); } })();

        // ========== IndexedDB ==========
        let _db = null, _memRecords = [];
        function openDB() { return new Promise(resolve => { try { const req = indexedDB.open('DictationDB', 1); req.onupgradeneeded = e => { const db = e.target.result; if (!db.objectStoreNames.contains('records')) db.createObjectStore('records', { keyPath: 'id', autoIncrement: true }); }; req.onsuccess = e => { _db = e.target.result; resolve(_db); }; req.onerror = () => resolve(null); } catch (e) { resolve(null); } }); }
        async function dbAdd(store, obj) { if (_db) { try { await new Promise((resolve, reject) => { const tx = _db.transaction(store, 'readwrite'); tx.objectStore(store).add(obj); tx.oncomplete = () => resolve(); tx.onerror = e => reject(e.target.error); }); return; } catch (e) {} } if (store === 'records') _memRecords.push(obj); }
        async function dbGetAll(store) { if (_db) { try { return await new Promise((resolve, reject) => { const tx = _db.transaction(store, 'readonly'); const r = tx.objectStore(store).getAll(); r.onsuccess = () => resolve(r.result || []); r.onerror = e => reject(e.target.error); }); } catch (e) {} } return store === 'records' ? [..._memRecords] : []; }
        async function dbClear(store) { if (_db) { try { await new Promise((resolve, reject) => { const tx = _db.transaction(store, 'readwrite'); tx.objectStore(store).clear(); tx.oncomplete = () => resolve(); tx.onerror = e => reject(e.target.error); }); } catch (e) {} } if (store === 'records') _memRecords.length = 0; }

        // ========== 数据层 ==========
        const LS_GROUPS = 'wb_dict_v5_groups', LS_SETTINGS = 'wb_dict_v5_settings';
        let groups = {}, currentGroup = '未分组';
        function loadData() { try { const raw = localStorage.getItem(LS_GROUPS); if (raw) { const d = JSON.parse(raw); if (d && typeof d === 'object' && d.groups) { groups = d.groups; currentGroup = d.currentGroup || '未分组'; if (!groups[currentGroup]) { const k = Object.keys(groups); currentGroup = k[0] || '未分组'; } return; } else if (Array.isArray(d)) { groups = { '未分组': d }; currentGroup = '未分组'; saveData(); return; } }
            groups = { '未分组': [{ id: genId(), text: '春天', lang: 'zh', note: '' }, { id: genId(), text: 'school', lang: 'en', note: '' }, { id: genId(), text: 'teacher', lang: 'en', note: '老师' }, { id: genId(), text: 'beautiful', lang: 'en', note: '美丽的' }] };
            currentGroup = '未分组'; saveData();
        } catch (e) { groups = { '未分组': [] }; currentGroup = '未分组'; saveData(); } }
        function saveData() { try { localStorage.setItem(LS_GROUPS, JSON.stringify({ groups, currentGroup })); } catch (e) {} }
        function getCurrentWords() { return groups[currentGroup] || []; }
        function setCurrentWords(w) { groups[currentGroup] = w; saveData(); }
        function getAllGroupNames() { return Object.keys(groups); }
        function addGroup(name) { name = (name || '').trim(); if (!name || groups[name]) return false; groups[name] = []; currentGroup = name; saveData(); return true; }
        function deleteGroup(name) { if (name === '未分组' || !groups[name]) return false; delete groups[name]; const k = Object.keys(groups); currentGroup = k[0] || '未分组'; saveData(); return true; }

        // ========== 设置 ==========
        let settings = { loop: 2, rate: 0.9, gap: 0.9, pause: 1.2, showNote: true, voiceEngine: 'auto' };
        function loadSettings() { try { const s = localStorage.getItem(LS_SETTINGS); if (s) settings = Object.assign(settings, JSON.parse(s)); } catch (e) {} if (!settings.voiceEngine) settings.voiceEngine = 'auto'; }
        function saveSettings() { try { localStorage.setItem(LS_SETTINGS, JSON.stringify(settings)); } catch (e) {} }

        // ========== 语音引擎 ==========
        let synth = window.speechSynthesis || null, voices = [], _ttsOk = !!(synth && typeof synth.speak === 'function');
        if (_ttsOk) { try { const p = new SpeechSynthesisUtterance(' '); synth.speak(p); setTimeout(() => { try { synth.cancel() } catch (e) {} }, 1500); } catch (e) { _ttsOk = false; } }
        function loadVoices() { if (!_ttsOk) return; try { voices = synth.getVoices() || [] } catch (e) { voices = [] } }
        if (_ttsOk) { loadVoices(); if ('onvoiceschanged' in synth) synth.onvoiceschanged = loadVoices; }
        function pickVoice(lang) { if (!voices.length) return null; const t = lang === 'en' ? 'en' : 'zh'; let v = voices.find(x => x.lang && x.lang.toLowerCase().startsWith(t)); if (!v) v = voices.find(x => x.lang && x.lang.toLowerCase().includes(t)); return v || null; }
        function speak(text, lang, rate) {
            return new Promise(resolve => {
                if (!text) { resolve(); return; }
                const engine = getVoiceEngine();
                if (engine === 'system') {
                    if (!_ttsOk) { resolve(); return; }
                    const u = new SpeechSynthesisUtterance(text);
                    u.lang = lang === 'en' ? 'en-US' : 'zh-CN';
                    const v = pickVoice(lang); if (v) u.voice = v;
                    u.rate = typeof rate === 'number' ? rate : settings.rate; u.pitch = 1;
                    let done = false;
                    u.onend = () => { if (!done) { done = true; resolve(); } };
                    u.onerror = () => { if (!done) { done = true; resolve(); } };
                    try { synth.speak(u); } catch (e) { if (!done) { done = true; resolve(); } }
                    setTimeout(() => { if (!done) { done = true; resolve(); } }, 8000);
                } else {
                    const langP = lang === 'en' ? 'en' : 'zh';
                    const spd = Math.min(2, Math.max(0.5, rate || settings.rate || .9));
                    const url = `https://texttospeech.responsivevoice.org/v1/text:synthesize?text=${encodeURIComponent(text)}&lang=${langP}&engine=g3&speed=${spd}`;
                    const audio = new Audio(url);
                    let done = false;
                    const cleanup = () => { if (!done) { done = true; resolve(); } };
                    audio.onended = cleanup; audio.onerror = cleanup;
                    audio.play().catch(cleanup); setTimeout(cleanup, 12000);
                }
            });
        }
        function getVoiceEngine() { const m = settings.voiceEngine || 'auto'; if (m === 'system') return 'system'; if (m === 'online') return 'online'; return _ttsOk ? 'system' : 'online'; }
        function updateVoiceUI() { const dot = $('voiceDot'), sel = $('voiceEngineSelect'); if (sel) sel.value = settings.voiceEngine || 'auto'; if (!dot) return; const mode = settings.voiceEngine || 'auto'; let available = false; if (mode === 'system') available = _ttsOk; else if (mode === 'online') available = !!navigator.onLine; else available = _ttsOk || !!navigator.onLine; dot.className = 'voice-dot' + (available ? '' : ' err'); }

        // ========== 播放控制 ==========
        let seqToken = 0, singleToken = 0, isPlaying = false;
        function updatePlayUI() { const b = $('startBtn'); if (!b) return; if (isPlaying) { b.classList.add('stop'); b.innerHTML = '<svg viewBox="0 0 24 24" fill="#fff" style="width:22px;height:22px"><rect x="6" y="6" width="12" height="12" rx="2"/></svg> 停止'; } else { b.classList.remove('stop'); b.innerHTML = '<svg viewBox="0 0 24 24" fill="#fff" style="width:22px;height:22px"><path d="M8 5v14l11-7z"/></svg> 开始听写'; } }
        function showNow(text, prog) { const n = $('nowPlaying'); n.classList.add('show'); $('npWord').textContent = text || ''; $('npProg').textContent = prog || ''; }
        function hideNow() { $('nowPlaying').classList.remove('show'); $('npWord').textContent = ''; $('npProg').textContent = ''; }
        async function playWordLoop(item, loop, tokenRef, token) { const delay = settings.gap * 1000; for (let r = 0; r < loop; r++) { if (tokenRef.value !== token) return false; await speak(item.text, item.lang); if (r < loop - 1 && tokenRef.value === token) await sleep(delay); } return true; }
        function switchTab(tabName) { document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active')); const targetBtn = document.querySelector(`.tab-btn[data-tab="${tabName}"]`); if (targetBtn) targetBtn.classList.add('active'); const panel = $(`tab-${tabName}`); if (panel) panel.classList.add('active'); if (tabName === 'stats') updateStats(); if (tabName === 'wordbank') render(); }
        function highlightById(id) { clearHighlight(); if (!id) return; const item = document.querySelector(`.word-item[data-id="${id}"]`); if (item) item.classList.add('highlight'); }
        function clearHighlight() { document.querySelectorAll('.word-item').forEach(el => el.classList.remove('highlight')); }
        async function playAll(shuffle = false) {
            if (isPlaying) { stopPlay(); return; }
            let words = getCurrentWords();
            if (!words.length) { toast('词库为空，先导入词语'); return; }
            if (shuffle) { words = [...words]; for (let i = words.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [words[i], words[j]] = [words[j], words[i]]; } }
            isPlaying = true; updatePlayUI();
            const token = ++seqToken, loop = settings.loop, wp = settings.pause * 1000;
            const items = document.querySelectorAll('.word-item');
            for (let i = 0; i < words.length; i++) {
                if (seqToken !== token) break;
                const w = words[i];
                const display = settings.showNote && w.note ? `${w.text}（${w.note}）` : w.text;
                showNow(display, `第 ${i+1}/${words.length} 个`);
                if (w.id) highlightById(w.id);
                else if (items[i]) items[i].classList.add('highlight');
                const ok = await playWordLoop(w, loop, { value: token }, token);
                if (!ok) break; if (seqToken !== token) break;
                await sleep(wp);
            }
            isPlaying = false; updatePlayUI(); seqToken++; hideNow(); clearHighlight();
            showInputModal('记录成绩', '请输入本次听写错了多少个', '例如 2', val => {
                const err = parseInt(val);
                if (!isNaN(err) && err >= 0 && err <= words.length) { const correct = words.length - err; recordDictationResult(correct, words.length, words); } else { toast('输入无效，未记录'); }
            });
        }
        async function playOne(idx) { const words = getCurrentWords(); const w = words[idx]; if (!w) return; const token = ++singleToken; showNow(settings.showNote && w.note ? `${w.text}（${w.note}）` : w.text, '单条播放'); if (w.id) highlightById(w.id); else { const items = document.querySelectorAll('.word-item'); if (items[idx]) items[idx].classList.add('highlight'); } await playWordLoop(w, settings.loop, { value: token }, token); if (singleToken === token) { hideNow(); clearHighlight(); } }
        function stopPlay() { seqToken++; singleToken++; try { synth?.cancel() } catch (e) {} isPlaying = false; updatePlayUI(); hideNow(); clearHighlight(); }

        // ========== 词库操作 ==========
        function addWord(text, langPref, note = '') { text = (text || '').trim(); if (!text) return false; const lang = langPref === 'auto' || !langPref ? detectLang(text) : langPref; const w = { id: genId(), text, lang, note: note || '' }; const words = getCurrentWords(); words.push(w); setCurrentWords(words); render(); return true; }
        function deleteWord(id) { const words = getCurrentWords(); const idx = words.findIndex(w => w.id === id); if (idx < 0) return; words.splice(idx, 1); setCurrentWords(words); render(); }
        function editWord(id, text, langPref, note) { const words = getCurrentWords(); const w = words.find(x => x.id === id); if (!w) return; text = (text || '').trim(); if (!text) { toast('词语不能为空'); return; } w.text = text; w.lang = langPref === 'auto' || !langPref ? detectLang(text) : langPref; w.note = (note || '').trim(); setCurrentWords(words); render(); }
        function parseAndImport(raw) { const lines = String(raw || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean); if (!lines.length) { toast('没有可导入的内容'); return; } let added = 0; lines.forEach(line => { if (line.indexOf('|') !== -1) { const parts = line.split('|'); const text = parts[0].trim(); const note = parts.slice(1).join('|').trim(); if (text) { addWord(text, 'auto', note); added++; } } else { if (addWord(line, 'auto', '')) added++; } }); render(); toast(`已导入 ${added} 个词语到「${currentGroup}」`); }
        function importBulk() { parseAndImport($('importArea').value); $('importArea').value = ''; }

        // ========== 统计 ==========
        async function recordDictationResult(correct, total, wordsList) { const record = { correct, total, accuracy: total > 0 ? Math.round(correct / total * 100) : 0, date: new Date().toISOString(), words: wordsList.slice(0, 10).map(w => w.text) }; await dbAdd('records', record); toast(`听写完成！正确率 ${record.accuracy}% (正确 ${correct} 个，错误 ${total - correct} 个)`); switchTab('stats'); }
        async function updateStats() { const records = await dbGetAll('records').catch(() => []); const allWords = [...Object.values(groups).flat()] || []; const total = records.length; const avgAcc = total > 0 ? Math.round(records.reduce((s, r) => s + r.accuracy, 0) / total) : null; $('statTotal').textContent = total; $('statAvgAcc').textContent = avgAcc !== null ? avgAcc + '%' : '--%'; $('statWords').textContent = allWords.length; drawChart(records.slice(-7)); renderHistory(records.slice(-10).reverse()); }
        function drawChart(records) { const c = $('accChart'); if (!c) return; const ctx2 = c.getContext('2d'); const dpr = window.devicePixelRatio || 1; const rect = c.getBoundingClientRect(); c.width = rect.width * dpr; c.height = rect.height * dpr; ctx2.scale(dpr, dpr); const W = rect.width, H = rect.height; ctx2.clearRect(0, 0, W, H); if (!records.length) { ctx2.fillStyle = '#aaa'; ctx2.font = '13px sans-serif'; ctx2.textAlign = 'center'; ctx2.fillText('暂无数据', W / 2, H / 2); return; } const pad = { t: 10, b: 24, l: 36, r: 12 }; const cW = W - pad.l - pad.r, cH = H - pad.t - pad.b; const pts = records.map((r, i) => ({ x: pad.l + cW * i / (records.length - 1 || 1), y: pad.t + cH * (1 - r.accuracy / 100) })); ctx2.strokeStyle = '#ECE0CF'; ctx2.lineWidth = 1; [0, 25, 50, 75, 100].forEach(v => { const y = pad.t + cH * (1 - v / 100); ctx2.beginPath(); ctx2.moveTo(pad.l, y); ctx2.lineTo(W - pad.r, y); ctx2.stroke(); }); ctx2.fillStyle = '#8A7A6D'; ctx2.font = '10px sans-serif'; ctx2.textAlign = 'right'; [0, 25, 50, 75, 100].forEach(v => { ctx2.fillText(v + '%', pad.l - 4, pad.t + cH * (1 - v / 100) + 3); }); if (pts.length > 1) { ctx2.beginPath(); ctx2.moveTo(pts[0].x, pts[0].y); for (let i = 1; i < pts.length; i++) ctx2.lineTo(pts[i].x, pts[i].y); ctx2.strokeStyle = '#E8743B'; ctx2.lineWidth = 2.5; ctx2.stroke(); } pts.forEach((p, i) => { ctx2.beginPath(); ctx2.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx2.fillStyle = '#E8743B'; ctx2.fill(); ctx2.fillStyle = '#3B2F2A'; ctx2.font = 'bold 10px sans-serif'; ctx2.textAlign = 'center'; ctx2.fillText(records[i]?.accuracy + '%', p.x, p.y - 10); }); }
        function renderHistory(records) { const el = $('historyList'); if (!records.length) { el.innerHTML = '<div style="color:var(--muted);font-size:13px;padding:8px 0">暂无记录</div>'; return; } el.innerHTML = records.map(r => { const cls = r.accuracy >= 80 ? 'good' : r.accuracy >= 50 ? 'avg' : 'poor'; const d = new Date(r.date); const timeStr = d.toLocaleDateString('zh-CN', { month: 'numeric', day: 'numeric' }) + ' ' + d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }); return `<div class="history-item"><span class="hi-time">${timeStr}</span><span class="hi-score ${cls}">${r.accuracy}%</span><span style="color:var(--muted);font-size:12px">共 ${r.total} 词</span></div>`; }).join(''); }

        // ================================================================
        // OCR 图像预处理流水线（Tesseract）
        // ================================================================
        const MAX_PIXELS = 4000000;
        
        function resizeToOptimal(canvas) {
            const sw = canvas.width, sh = canvas.height;
            const MIN_SIZE = 600, MAX_SIZE = 2000;
            let scale = 1;
            if (Math.min(sw, sh) < MIN_SIZE) { scale = MIN_SIZE / Math.min(sw, sh); }
            else if (Math.max(sw, sh) > MAX_SIZE) { scale = MAX_SIZE / Math.max(sw, sh); }
            if (sw * sh > MAX_PIXELS && scale === 1) { scale = Math.sqrt(MAX_PIXELS / (sw * sh)); }
            if (scale === 1) return canvas;
            const newW = Math.round(sw * scale), newH = Math.round(sh * scale);
            const c = document.createElement('canvas'); c.width = newW; c.height = newH;
            const ctx = c.getContext('2d'); ctx.imageSmoothingQuality = 'high'; ctx.drawImage(canvas, 0, 0, newW, newH);
            return c;
        }
        
        function toGrayscaleFast(canvas) {
            const sw = canvas.width, sh = canvas.height;
            const c = document.createElement('canvas'); c.width = sw; c.height = sh;
            const ctx = c.getContext('2d'); ctx.drawImage(canvas, 0, 0);
            const imgData = ctx.getImageData(0, 0, sw, sh);
            const data = imgData.data;
            for (let i = 0; i < data.length; i += 4) {
                const gray = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
                data[i] = data[i+1] = data[i+2] = gray | 0;
            }
            ctx.putImageData(imgData, 0, 0); return c;
        }
        function toGrayscale(canvas) { return toGrayscaleFast(canvas); }
        
        function adjustGamma(canvas, gamma = 1.0) {
            const sw = canvas.width, sh = canvas.height;
            const c = document.createElement('canvas'); c.width = sw; c.height = sh;
            const ctx = c.getContext('2d'); ctx.drawImage(canvas, 0, 0);
            const imgData = ctx.getImageData(0, 0, sw, sh); const data = imgData.data;
            const invGamma = 1 / gamma;
            for (let i = 0; i < data.length; i += 4) {
                data[i] = Math.round(255 * Math.pow(data[i] / 255, invGamma));
                data[i+1] = Math.round(255 * Math.pow(data[i+1] / 255, invGamma));
                data[i+2] = Math.round(255 * Math.pow(data[i+2] / 255, invGamma));
            }
            ctx.putImageData(imgData, 0, 0); return c;
        }
        
        function rotateCanvas(canvas, degrees) {
            const rad = degrees * Math.PI / 180;
            const c = document.createElement('canvas'); c.width = canvas.width; c.height = canvas.height;
            const ctx = c.getContext('2d'); ctx.translate(c.width/2, c.height/2); ctx.rotate(rad);
            ctx.drawImage(canvas, -canvas.width/2, -canvas.height/2); return c;
        }
        
        function applyLightPreprocess(canvas) {
            let processed = resizeToOptimal(canvas);
            processed = toGrayscale(processed);
            processed = adjustGamma(processed, 1.1);
            return processed;
        }
        
        function medianFilter(canvas) {
            const sw = canvas.width, sh = canvas.height;
            const c = document.createElement('canvas'); c.width = sw; c.height = sh;
            const ctx = c.getContext('2d');
            const srcData = canvas.getContext('2d').getImageData(0, 0, sw, sh);
            const dstData = ctx.createImageData(sw, sh);
            const s = srcData.data, d = dstData.data;
            for (let y = 1; y < sh - 1; y++) {
                for (let x = 1; x < sw - 1; x++) {
                    const idx = (y * sw + x) * 4;
                    const vals = [s[(y-1)*sw+x-1]*4, s[(y-1)*sw+x]*4, s[(y-1)*sw+(x+1)]*4,
                                  s[y*sw+x-1]*4, s[idx], s[y*sw+(x+1)]*4,
                                  s[(y+1)*sw+x-1]*4, s[(y+1)*sw+x]*4, s[(y+1)*sw+(x+1)]*4].sort((a,b) => a-b);
                    const median = vals[4];
                    d[idx] = d[idx+1] = d[idx+2] = median; d[idx+3] = 255;
                }
            }
            ctx.putImageData(dstData, 0, 0); return c;
        }
        
        function adaptiveThreshold(canvas, windowSize = 11, C = 5) {
            const sw = canvas.width, sh = canvas.height;
            const c = document.createElement('canvas'); c.width = sw; c.height = sh;

        function render() { renderGroupSelector(); const words = getCurrentWords(); $('wordCount').textContent = words.length; $('loopLabel').textContent = settings.loop; const list = $('wordList'); if (!words.length) { list.innerHTML = '<div class="empty">词库还是空的～先导入词语吧</div>'; return; } let html = ''; for (let i = 0; i < words.length; i++) { const w = words[i]; html += `<div class="word-item" data-id="${w.id}"><div class="wi-handle" data-act="drag" title="按住拖动排序"><svg viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/></svg></div><div class="wi-main"><div class="wi-top"><span class="wi-text${w.lang==='en'?' en':''}">${esc(w.text)}</span><span class="tag ${w.lang==='en'?'en':'zh'}">${langText(w.lang)}</span></div>${w.note?`<div class="wi-note">${esc(w.note)}</div>`:''}<div class="edit-box" id="edit-${w.id}"><input type="text" class="e-word" value="${esc(w.text)}" placeholder="词语"><select class="e-lang"><option value="auto"${w.lang===''?' selected':''}>自动</option><option value="zh"${w.lang==='zh'?' selected':''}>中文</option><option value="en"${w.lang==='en'?' selected':''}>英文</option></select><input type="text" class="e-note" value="${esc(w.note)}" placeholder="释义"><button class="mini-btn primary e-save" style="flex:0 0 60px;min-height:32px;font-size:13px;padding:4px 8px">存</button></div></div><div class="wi-actions"><button class="icon-btn play" data-act="play" title="发音"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 010 6"/></svg></button><button class="icon-btn edit" data-act="edit" title="编辑"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M14 6l4 4"/></svg></button><button class="icon-btn del" data-act="del" title="删除"><svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V5h6v2M7 7l1 13h8l1-13"/></svg></button></div></div>`; } list.innerHTML = html; updateVoiceUI(); }

        // ========== 模态框 ==========
        let inputModalCallback = null;
        function showInputModal(title, desc, placeholder, callback) { $('inputModalTitle').textContent = title; $('inputModalDesc').textContent = desc || ''; $('inputModalInput').value = ''; $('inputModalInput').placeholder = placeholder || '请输入…'; $('inputModalMask').classList.add('show'); inputModalCallback = callback; setTimeout(() => $('inputModalInput').focus(), 100); }
        $('inputModalOk').addEventListener('click', function() { const val = $('inputModalInput').value.trim(); $('inputModalMask').classList.remove('show'); const cb = inputModalCallback; inputModalCallback = null; cb?.(val); });
        $('inputModalCancel').addEventListener('click', function() { $('inputModalMask').classList.remove('show'); const cb = inputModalCallback; inputModalCallback = null; cb?.(null); });
        $('inputModalInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('inputModalOk').click(); });
        let confirmModalCallback = null;
        function confirmModal(title, text, cb, okLabel) { $('confirmModalTitle').textContent = title; $('confirmModalText').textContent = text; $('confirmModalOk').textContent = okLabel ?? '确定'; $('confirmModalMask').classList.add('show'); confirmModalCallback = cb; }
        $('confirmModalOk').addEventListener('click', function() { $('confirmModalMask').classList.remove('show'); const cb = confirmModalCallback; confirmModalCallback = null; cb?.(); });
        $('confirmModalCancel').addEventListener('click', function() { $('confirmModalMask').classList.remove('show'); confirmModalCallback = null; });

        // ========== 事件绑定 ==========
        function bind() {
            $('startBtn').addEventListener('click', () => playAll(false));
            $('shuffleBtn').addEventListener('click', () => playAll(true));
            ['loop', 'rate', 'gap', 'pause'].forEach(k => { const range = $(`${k}Range`), val = $(`${k}Val`); range.addEventListener('input', () => { settings[k] = +range.value; val.textContent = range.value; if (k === 'loop') $('loopLabel').textContent = range.value; if (['rate', 'gap', 'pause'].includes(k)) val.textContent = (+range.value).toFixed(1); saveSettings(); }); });
            $('showNote').addEventListener('change', e => { settings.showNote = e.target.checked; saveSettings(); });
            document.querySelectorAll('.tab-btn').forEach(btn => { btn.addEventListener('click', () => { const tab = btn.dataset.tab; switchTab(tab); }); });
            $('voiceEngineSelect').addEventListener('change', function() { settings.voiceEngine = this.value; saveSettings(); updateVoiceUI(); toast('已切换至 ' + this.options[this.selectedIndex].text + ' 语音'); });
            $('groupSelector').addEventListener('change', function() { if (this.value && groups[this.value]) { currentGroup = this.value; saveData(); render(); } });
            $('addGroupBtn').addEventListener('click', () => showInputModal('新建课程', '请输入课程名称', '例如：第1课', name => { if (name && addGroup(name)) { render(); toast('已创建：' + name); } else toast('名称无效或已存在'); }));
            $('delGroupBtn').addEventListener('click', () => { if (currentGroup === '未分组') { toast('不能删除默认课程'); return; } confirmModal('删除课程', '确定删除「' + currentGroup + '」及其所有词语？', () => { if (deleteGroup(currentGroup)) { render(); toast('已删除'); } }); });
            $('importBtn').addEventListener('click', importBulk);
            $('clearImportBtn').addEventListener('click', () => { 
                $('importArea').value = ''; 
                const ocrEl = document.getElementById('ocrResult'); 
                if (ocrEl) ocrEl.classList.remove('show'); 
                toast('已清空'); 
            });
            $('exportBtn').addEventListener('click', exportJson);
            $('importJsonBtn').addEventListener('click', () => $('importFile').click());
            $('importFile').addEventListener('change', e => { if (e.target.files[0]) importJson(e.target.files[0]); e.target.value = ''; });
            $('clearSampleBtn').addEventListener('click', () => confirmModal('重置示例', '将覆盖当前数据为初始示例，确定？', () => { groups = { '未分组': [{ id: genId(), text: '春天', lang: 'zh', note: '' }, { id: genId(), text: 'school', lang: 'en', note: '' }, { id: genId(), text: 'teacher', lang: 'en', note: '老师' }] }; currentGroup = '未分组'; saveData(); render(); toast('已重置示例'); }));
            $('clearAllBtn').addEventListener('click', () => confirmModal('清空全部', '将删除所有课程及词语，建议先导出备份。确定继续？', () => { groups = { '未分组': [] }; currentGroup = '未分组'; saveData(); render(); toast('已清空'); }));
            $('wordList').addEventListener('click', e => { const btn = e.target.closest('[data-act]'); if (!btn) return; const item = e.target.closest('.word-item'); if (!item) return; const id = item.dataset.id; const act = btn.dataset.act; const words = getCurrentWords(); const idx = words.findIndex(w => w.id === id); if (act === 'play') playOne(idx); else if (act === 'edit') { const box = $(`edit-${id}`); if (box.classList.contains('show')) box.classList.remove('show'); else { document.querySelectorAll('.edit-box.show').forEach(b => b.classList.remove('show')); box?.classList.add('show'); } } else if (act === 'del') deleteWord(id); });
            $('wordList').addEventListener('click', e => { if (!e.target.classList.contains('e-save')) return; const box = e.target.closest('.edit-box'); if (!box) return; const item = box.closest('.word-item'); const id = item.dataset.id; editWord(id, box.querySelector('.e-word').value, box.querySelector('.e-lang').value, box.querySelector('.e-note').value); });
            document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return; if (e.code === 'Space') { e.preventDefault(); playAll(); } if (e.code === 'KeyS' && e.ctrlKey) { e.preventDefault(); exportJson(); } });
            initCropOverlay(); setupAlbum(); const btnCancel = document.getElementById('btnCancelOcr'); if (btnCancel) btnCancel.addEventListener('click', cancelOcrLoading);
            initResizeHandle();
            const list = $('wordList'); if (list) { let dragEl = null, startY = 0, pointerId = null; function afterElement(y) { const els = [...list.querySelectorAll('.word-item:not(.dragging)')]; let closest = { offset: -Infinity, el: null }; els.forEach(el => { const b = el.getBoundingClientRect(), o = y - b.top - b.height / 2; if (o < 0 && o > closest.offset) closest = { offset: o, el }; }); return closest.el; } list.addEventListener('pointerdown', e => { const handle = e.target.closest('.wi-handle'); if (!handle) return; dragEl = handle.closest('.word-item'); if (!dragEl) return; e.preventDefault(); pointerId = e.pointerId; try { dragEl.setPointerCapture(pointerId); } catch (_) {} startY = e.clientY; dragEl.classList.add('dragging'); }); list.addEventListener('pointermove', e => { if (!dragEl) return; e.preventDefault(); dragEl.style.transform = `translateY(${e.clientY-startY}px)`; const after = afterElement(e.clientY); if (!after) list.appendChild(dragEl); else list.insertBefore(dragEl, after); startY = e.clientY; dragEl.style.transform = ''; }); function endDrag() { if (!dragEl) return; try { dragEl.releasePointerCapture(pointerId); } catch (_) {} dragEl.classList.remove('dragging'); dragEl.style.transform = ''; dragEl.style.zIndex = ''; const ids = [...list.querySelectorAll('.word-item')].map(el => el.dataset.id); const words = getCurrentWords(); const map = {}; words.forEach(w => map[w.id] = w); const ordered = ids.map(id => map[id]).filter(Boolean); if (ordered.length === words.length && ordered.some((w, i) => w.id !== words[i].id)) { setCurrentWords(ordered); toast('已调整顺序'); } dragEl = null; pointerId = null; } list.addEventListener('pointerup', endDrag); list.addEventListener('pointercancel', endDrag); }
        }

        // ========== 导出/导入 ==========
        function exportJson() { const data = { app: 'dictation', version: 6, groups, currentGroup, settings, exportedAt: new Date().toISOString() }; const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '听写词库备份_v6_' + new Date().toISOString().slice(0, 10) + '.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); toast('已导出备份'); }
        function importJson(file) { const reader = new FileReader(); reader.onload = () => { try { const data = JSON.parse(reader.result); if (!data?.groups || typeof data.groups !== 'object') { toast('文件格式不正确'); return; } groups = data.groups; currentGroup = data.currentGroup || Object.keys(groups)[0] || '未分组'; if (!groups[currentGroup]) { const k = Object.keys(groups); currentGroup = k[0] || '未分组'; } if (data.settings) settings = Object.assign(settings, data.settings); saveData(); saveSettings(); applySettingsUI(); render(); toast(`已恢复 ${Object.keys(groups).length} 个课程`); } catch (e) { toast('解析失败：' + e.message); } }; reader.readAsText(file); }
        function applySettingsUI() { $('loopRange').value = settings.loop; $('loopVal').textContent = settings.loop; $('loopLabel').textContent = settings.loop; $('rateRange').value = settings.rate; $('rateVal').textContent = (+settings.rate).toFixed(1); $('gapRange').value = settings.gap; $('gapVal').textContent = (+settings.gap).toFixed(1); $('pauseRange').value = settings.pause; $('pauseVal').textContent = (+settings.pause).toFixed(1); $('showNote').checked = settings.showNote; const sel = $('voiceEngineSelect'); if (sel) sel.value = settings.voiceEngine || 'auto'; updateVoiceUI(); }

        // ========== 启动 ==========
        async function start() {
            try { 
                await openDB(); 
                loadSettings(); 
                loadData(); 
                applySettingsUI(); 
                bind(); 
                if (!_ttsOk && !navigator.onLine) {
                    setTimeout(() => toast('语音引擎不可用，请检查网络或手动切换引擎'), 600);
                }
                render(); 
                updateStats(); 
                if (typeof Tesseract === 'undefined') console.warn('Tesseract.js CDN 未加载'); 
            } catch (e) { 
                console.error('启动异常:', e); 
                toast('启动失败，请刷新页面重试'); 
            }
        }
        if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', start); } else { start(); }
    </script>
<script>
// 源码保护：禁止右键查看/查看源代码/开发者工具（不影响正常使用）
document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
document.addEventListener('keydown', function(e) {
    if (e.ctrlKey && (e.key === 'u' || e.key === 's' || e.key === 'U' || e.key === 'S')) {
        e.preventDefault();
    }
    if (e.key === 'F12') { e.preventDefault(); }
    if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) {
        e.preventDefault();
    }
});
</script>
