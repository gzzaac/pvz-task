<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阿涛的工具箱 · 首页</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    /* 吉卜力配色（与课程表同套色板） */
    --bg-mist: #eef4f0;        /* 雾绿白 */
    --card-bg: #fbfdf9;        /* 暖白 */
    --text-main: #5b554b;      /* 暖棕灰 */
    --text-sub: #8b9b8f;       /* 鼠尾草灰绿 */
    --green: #8cc1b4;          /* 吉卜力绿 */
    --green-deep: #6aa596;     /* 深一档绿（链接/强调，保证对比度） */
    --sky: #9fc6d8;            /* 天空蓝 */
    --honey: #f0c98f;          /* 蜂蜜黄 */
    --terra: #e7a78c;          /* 陶土橙 */
    --glass-bg: rgba(251, 253, 249, 0.55);
    --glass-border: rgba(215, 228, 219, 0.8);
  }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    min-height: 100vh;
    background: linear-gradient(150deg, #dcebf2 0%, #eef4f0 40%, #f6f1e3 75%, #e8f2ea 100%);
    background-attachment: fixed;
    color: var(--text-main);
    overflow-x: hidden;
    position: relative;
  }

  /* 漂浮的柔光泡泡背景装饰 */
  .bubble {
    position: fixed;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.55;
    pointer-events: none;
    z-index: 0;
    animation: float 12s ease-in-out infinite;
  }
  .bubble-1 { width: 420px; height: 420px; background: #f0c98f; top: -120px; left: -100px; }
  .bubble-2 { width: 360px; height: 360px; background: #9fc6d8; bottom: -100px; right: -80px; animation-delay: -4s; }
  .bubble-3 { width: 300px; height: 300px; background: #8cc1b4; top: 40%; left: 60%; animation-delay: -8s; }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(30px, -40px) scale(1.08); }
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 1080px;
    margin: 0 auto;
    padding: 64px 24px 80px;
  }

  /* ===== 顶部标题区 ===== */
  header { text-align: center; margin-bottom: 56px; }

  .site-badge {
    display: inline-block;
    padding: 8px 20px;
    border-radius: 999px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    font-size: 14px;
    letter-spacing: 2px;
    color: var(--text-sub);
    margin-bottom: 20px;
    box-shadow: 0 4px 20px rgba(120, 130, 120, 0.14);
  }

  h1 {
    font-size: clamp(32px, 5vw, 46px);
    font-weight: 700;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #6aa596, #7fb3c9, #d9a06e);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 14px;
  }

  .subtitle {
    font-size: 16px;
    color: var(--text-sub);
    letter-spacing: 0.5px;
  }

  /* ===== 卡片网格 ===== */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 32px;
  }

  .card {
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
    border-radius: 24px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 8px 32px rgba(120, 130, 120, 0.14);
    overflow: hidden;
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease;
  }

  .card:hover {
    transform: translateY(-8px) scale(1.02);
    box-shadow: 0 18px 48px rgba(120, 130, 120, 0.22);
  }

  /* 卡片"图片"区：每个工具专属渐变插画 */
  .card-art {
    height: 190px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .card-art .emoji {
    font-size: 76px;
    filter: drop-shadow(0 6px 14px rgba(0,0,0,0.18));
    transition: transform 0.35s ease;
  }

  .card:hover .card-art .emoji {
    transform: scale(1.15) rotate(-4deg);
  }

  /* 装饰性圆环 */
  .card-art::before {
    content: "";
    position: absolute;
    width: 200px; height: 200px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.35);
    top: -60px; right: -60px;
  }
  .card-art::after {
    content: "";
    position: absolute;
    width: 120px; height: 120px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.18);
    bottom: -40px; left: -30px;
  }

  .art-dictation { background: linear-gradient(135deg, #f5daa8, #eeb49a); }
  .art-pvz      { background: linear-gradient(135deg, #b9ddc7, #8cc1b4); }
  .art-schedule { background: linear-gradient(135deg, #b5d5e5, #8fbfd6); }

  .card-body {
    padding: 22px 24px 26px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .card-title {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card-desc {
    font-size: 14px;
    line-height: 1.7;
    color: var(--text-sub);
  }

  .card-go {
    margin-top: auto;   /* 钉在卡片底部，多张卡片的"开始使用"保持同一水平线 */
    padding-top: 16px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    font-weight: 600;
    color: var(--green-deep);
  }

  .card-go .arrow { transition: transform 0.3s ease; }
  .card:hover .card-go .arrow { transform: translateX(5px); }

  /* ===== 页脚 ===== */
  footer {
    text-align: center;
    margin-top: 64px;
    font-size: 13px;
    color: var(--text-sub);
    opacity: 0.85;
  }

  @media (max-width: 640px) {
    .container { padding: 44px 18px 60px; }
    .card-art { height: 160px; }
  }
</style>
</head>
<body>

  <div class="bubble bubble-1"></div>
  <div class="bubble bubble-2"></div>
  <div class="bubble bubble-3"></div>

  <div class="container">
    <header>
      <span class="site-badge">🧰 阿涛的工具箱</span>
      <h1>欢迎来到我的小工具站</h1>
      <p class="subtitle">实用小工具合集 · 点击卡片即可开始使用</p>
    </header>

    <main class="grid">

      <a class="card" href="./dictation.html">
        <div class="card-art art-dictation">
          <span class="emoji">📝</span>
        </div>
        <div class="card-body">
          <div class="card-title">听写小助手 <span style="font-size:13px;font-weight:500;color:#c97f58;">V6</span></div>
          <p class="card-desc">语文、英语听写辅助工具，图片转文字，正序、反序报读，让孩子在家轻松完成听写练习。</p>
          <span class="card-go">开始使用 <span class="arrow">→</span></span>
        </div>
      </a>

      <a class="card" href="./pvz-task.html">
        <div class="card-art art-pvz">
          <span class="emoji">🌻</span>
        </div>
        <div class="card-body">
          <div class="card-title">我的阳光花园保卫战</div>
          <p class="card-desc">植物大战僵尸主题的学习任务追踪器，完成任务收集阳光，保卫自己的小花园！</p>
          <span class="card-go">开始使用 <span class="arrow">→</span></span>
        </div>
      </a>

      <a class="card" href="./schedule.html">
        <div class="card-art art-schedule">
          <span class="emoji">📅</span>
        </div>
        <div class="card-body">
          <div class="card-title">课程表 · 智能排课</div>
          <p class="card-desc">支持多课程表切换、单双周排课，课节时间灵活可调，支持导出课程表图片，小学生到高中都能用。</p>
          <span class="card-go">开始使用 <span class="arrow">→</span></span>
        </div>
      </a>

    </main>

    <footer>© 阿涛 · 小工具合集 · 持续扩充中 ✨</footer>
  </div>

</body>
</html>
