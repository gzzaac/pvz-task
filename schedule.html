                const currentTitleColor = (s.titleColor && s.titleColor !== 'auto') ? s.titleColor : '#8cc1b4';
                const colorSwatches = headerColors.map(c =>
                    `<div class="color-swatch ${c === currentHeaderColor ? 'active' : ''}" data-color="${c}" style="background:${c}" title="${c}"></div>`
                    ).join('');

                openModal(`
                    <div class="modal-header"><h3>课程表设置</h3><button class="modal-close">✕</button></div>
                    <div class="modal-body">
                        <div class="form-row">
                            <div class="form-group"><label>课程表标题</label><input type="text" id="setTitle" value="${escapeHtml(data.title)}"></div>
                            <div class="form-group"><label>副标题 / 班级信息</label><input type="text" id="setSubtitle" value="${data.subtitle === '点击添加备注...' ? '' : escapeHtml(data.subtitle)}"></div>
                        </div>
                        <div class="form-row">
                            <div class="form-group small"><label>每周上课天数</label>
                                <select id="setDaysPerWeek">
                                    <option value="5" ${s.daysPerWeek === 5 ? 'selected' : ''}>5 天</option>
                                    <option value="6" ${s.daysPerWeek === 6 ? 'selected' : ''}>6 天</option>
                                    <option value="7" ${s.daysPerWeek === 7 ? 'selected' : ''}>7 天</option>
                                </select>
                            </div>
                            <div class="form-group checkbox-group" style="padding-bottom:8px;"><input type="checkbox" id="setShowTime" ${s.showTime ? 'checked' : ''}><label for="setShowTime">显示课时时间</label></div>
                        </div>

                        <div class="slots-section">
                            <div class="slots-section-title">
                                <span>时间规则（修改后下方节次实时更新）</span>
                            </div>
                            <div class="settings-auto-row">
                                <div class="form-group small"><label>第一节开始时间</label><input type="time" id="autoFirstStart" value="${auto.firstStartTime}"></div>
                                <div class="form-group tiny">
                                    <label>节数</label>
                                    <div class="input-with-btns">
                                        <button type="button" class="minus" data-target="autoCount">−</button>
                                        <input type="number" id="autoCount" min="1" max="16" value="${data.timeSlots.length}">
                                        <button type="button" class="plus" data-target="autoCount">+</button>
                                    </div>
                                </div>
                                <div class="form-group tiny">
                                    <label>单节时长(分)</label>
                                    <div class="input-with-btns">
                                        <button type="button" class="minus" data-target="autoDuration">−</button>
                                        <input type="number" id="autoDuration" min="5" max="300" value="${auto.periodDuration}">
                                        <button type="button" class="plus" data-target="autoDuration">+</button>
                                    </div>
                                </div>
                                <div class="form-group tiny">
                                    <label>课间(分)</label>
                                    <div class="input-with-btns">
                                        <button type="button" class="minus" data-target="autoBreak">−</button>
                                        <input type="number" id="autoBreak" min="0" max="120" value="${auto.breakDuration}">
                                        <button type="button" class="plus" data-target="autoBreak">+</button>
                                    </div>
                                </div>
                                <div class="form-group small"><label>午休插入位置</label><select id="autoLunchAfter">${lunchOptions.join('')}</select></div>
                                <div class="form-group tiny">
                                    <label>午休时长(分)</label>
                                    <div class="input-with-btns">
                                        <button type="button" class="minus" data-target="autoLunchDuration">−</button>
                                        <input type="number" id="autoLunchDuration" min="0" max="300" value="${auto.lunchDuration}">
                                        <button type="button" class="plus" data-target="autoLunchDuration">+</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="slots-section" style="margin-top:14px;">
                            <div class="slots-section-title"><span>单双周模式</span></div>
                            <div class="form-group checkbox-group" style="padding-bottom:4px;">
                                <input type="checkbox" id="oeEnabled" ${oe.enabled ? 'checked' : ''}>
                                <label for="oeEnabled">启用单双周模式（在当前课表基础上，课程格可标记仅单周/仅双周，按周自动交替显示）</label>
                            </div>
                            ${oe.enabled ? `
                            <div id="oeStatusRow" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px;background:rgba(0,0,0,0.045);border-radius:8px;font-size:0.75rem;">
                                <span style="flex:1;min-width:180px;">${oe.anchorDate ? oeStatusText : '尚未校准：保存后按提示选择本周是单周还是双周'}</span>
                                ${oe.anchorDate ? '<button type="button" class="btn btn-sm" id="oeReCalibrate">重新校准</button>' : ''}
                            </div>` : `
                            <div id="oeStatusRow" style="display:none;"></div>
                            `}
                        </div>

                        <div class="form-group" style="margin-top:14px;"><label>标题栏颜色</label>
                            <div class="color-picker-inline">
                                <div id="titleColorSwatches" style="display:flex;gap:6px;flex-wrap:wrap;">${colorSwatches}</div>
                                <input type="text" class="color-hex-input" id="setTitlebarColor" value="${currentTitleColor}" maxlength="7" placeholder="#8cc1b4">
                                <button class="btn" id="btnAutoTitleColor" style="font-size:0.7rem;">自动跟随主题</button>
                            </div>
                        </div>

                        <div class="form-group" style="margin-top:14px;"><label>表头颜色</label>
                            <div class="color-picker-inline">
                                <div id="headerColorSwatches" style="display:flex;gap:6px;flex-wrap:wrap;">${colorSwatches}</div>
                                <input type="text" class="color-hex-input" id="setHeaderColor" value="${currentHeaderColor}" maxlength="7" placeholder="#8cc1b4">
                                <button class="btn" id="btnAutoColor" style="font-size:0.7rem;">自动跟随主题</button>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn" id="btnCancelSettings">取消</button>
                        <button class="btn btn-primary" id="btnSaveSettings" style="min-width:80px;">保存</button>
                    </div>
                `, true);

                let selectedHeaderColor = currentHeaderColor;

                function readAutoParams() {
                    return {
                        count: Math.max(1, Math.min(16, parseInt($('#autoCount').value) || data.timeSlots.length)),
                        firstStart: $('#autoFirstStart').value,
                        duration: Math.max(5, Math.min(300, parseInt($('#autoDuration').value) || 40)),
                        breakMin: Math.max(0, Math.min(120, parseInt($('#autoBreak').value) || 10)),
                        lunchAfter: Math.max(0, Math.min(16, parseInt($('#autoLunchAfter').value) || 0)),
                        lunchDuration: Math.max(0, Math.min(300, parseInt($('#autoLunchDuration').value) || 120))
                    };
                }

                function applyAutoParams() {
                    const p = readAutoParams();
                    const old = data.timeSlots.slice();
                    data.timeSlots = generateSlots(p.count, p.firstStart, p.duration, p.breakMin, p.lunchAfter, p
                        .lunchDuration);
                    const keep = Math.min(old.length, data.timeSlots.length);
                    for (let i = 0; i < keep; i++) {
                        if (old[i].name && old[i].name !== `第${i + 1}节`) {
                            data.timeSlots[i].name = old[i].name;
                        }
                        if (old[i].merged) data.timeSlots[i].merged = true;
                    }
                }

                document.querySelectorAll('.input-with-btns button').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const target = document.getElementById(btn.dataset.target);
                        let val = parseInt(target.value) || 0;
                        const min = parseInt(target.min) || 0;
                        const max = parseInt(target.max) || 999;
                        if (btn.classList.contains('plus')) val++;
                        else val--;
                        target.value = Math.max(min, Math.min(max, val));
                        applyAutoParams();
                    });
                });

                ['autoFirstStart', 'autoCount', 'autoDuration', 'autoBreak', 'autoLunchAfter', 'autoLunchDuration']
                .forEach(id => {
                    const el = document.getElementById(id);
                    if (!el) return;
                    el.addEventListener('change', applyAutoParams);
                    el.addEventListener('keydown', (e) => { if (e.key === 'Enter') { el.blur();
                            applyAutoParams(); } });
                });

                document.querySelectorAll('#headerColorSwatches .color-swatch').forEach(swatch => {
                    swatch.addEventListener('click', () => {
                        selectedHeaderColor = swatch.dataset.color;
                        $('#setHeaderColor').value = selectedHeaderColor;
                        document.querySelectorAll('#headerColorSwatches .color-swatch').forEach(s => s
                            .classList.remove('active'));
                        swatch.classList.add('active');
                    });
                });
                $('#setHeaderColor').addEventListener('input', () => {
                    const v = $('#setHeaderColor').value.trim().toLowerCase();
                    if (/^#[0-9a-f]{6}$/.test(v)) {
                        selectedHeaderColor = v;
                        document.querySelectorAll('#headerColorSwatches .color-swatch').forEach(s => s.classList
                            .toggle('active', s.dataset.color === v));
                    }
                });
                $('#btnAutoColor').addEventListener('click', () => {
                    selectedHeaderColor = '#8cc1b4';
                    $('#setHeaderColor').value = '#8cc1b4';
                    document.querySelectorAll('#headerColorSwatches .color-swatch').forEach(s => s.classList
                        .toggle('active', s.dataset.color === '#8cc1b4'));
                });

                let selectedTitleColor = currentTitleColor;
                document.querySelectorAll('#titleColorSwatches .color-swatch').forEach(swatch => {
                    swatch.addEventListener('click', () => {
                        selectedTitleColor = swatch.dataset.color;
                        $('#setTitlebarColor').value = selectedTitleColor;
                        document.querySelectorAll('#titleColorSwatches .color-swatch').forEach(s => s
                            .classList.remove('active'));
                        swatch.classList.add('active');
                    });
                });
                $('#setTitlebarColor').addEventListener('input', () => {
                    const v = $('#setTitlebarColor').value.trim().toLowerCase();
                    if (/^#[0-9a-f]{6}$/.test(v)) {
                        selectedTitleColor = v;
                        document.querySelectorAll('#titleColorSwatches .color-swatch').forEach(s => s.classList
                            .toggle('active', s.dataset.color === v));
                    }
                });
                $('#btnAutoTitleColor').addEventListener('click', () => {
                    selectedTitleColor = 'auto';
                    $('#setTitlebarColor').value = '#8cc1b4';
                    document.querySelectorAll('#titleColorSwatches .color-swatch').forEach(s => s.classList.remove(
                        'active'));
                });

                $('#btnCancelSettings').addEventListener('click', closeModal);

                $('#oeEnabled').addEventListener('change', () => {
                    const row = $('#oeStatusRow');
                    if (!row) return;
                    if ($('#oeEnabled').checked) {
                        const oeNow = data.settings.oddEven;
                        row.style.display = '';
                        row.innerHTML =
                            `<span style="flex:1;min-width:180px;">${oeNow.anchorDate ? oeStatusText : '尚未校准：保存后按提示选择本周是单周还是双周'}</span>` +
                            (oeNow.anchorDate ?
                                '<button type="button" class="btn btn-sm" id="oeReCalibrate">重新校准</button>' :
                                '');
                        const rec = $('#oeReCalibrate');
                        if (rec) rec.addEventListener('click', openOeCalibrationModal);
                    } else {
                        row.style.display = 'none';
                    }
                });
                const oeReCal = $('#oeReCalibrate');
                if (oeReCal) oeReCal.addEventListener('click', openOeCalibrationModal);

                $('#btnSaveSettings').addEventListener('click', () => {
                    data.title = $('#setTitle').value.trim() || '我的课程表';
                    data.subtitle = $('#setSubtitle').value.trim() || '点击添加备注...';
                    syncCurrentScheduleName();
                    data.settings.daysPerWeek = parseInt($('#setDaysPerWeek').value);
                    data.settings.showTime = $('#setShowTime').checked;
                    data.settings.auto = {
                        firstStartTime: $('#autoFirstStart').value,
                        periodDuration: parseInt($('#autoDuration').value) || 40,
                        breakDuration: parseInt($('#autoBreak').value) || 10,
                        lunchAfterPeriod: parseInt($('#autoLunchAfter').value) || 0,
                        lunchDuration: parseInt($('#autoLunchDuration').value) || 120
                    };
                    Object.keys(data.schedule).forEach(key => {
                        const [day, slot] = key.split('-').map(Number);
                        if (day >= data.settings.daysPerWeek || slot >= data.timeSlots.length) delete data
                            .schedule[key];
                    });
                    const hc = selectedHeaderColor.trim().toLowerCase();
                    data.settings.headerColor = (!hc || hc === '#8cc1b4') ? 'auto' : hc;
                    const tc = selectedTitleColor.trim().toLowerCase();
                    data.settings.titleColor = (!tc || tc === '#8cc1b4') ? 'auto' : tc;
                    const oeChecked = $('#oeEnabled').checked;
                    const wasEnabled = oe.enabled;
                    data.settings.oddEven.enabled = oeChecked;
                    data.settings.oddEven.viewOverride = null;
                    const needOeCalibration = oeChecked && (!wasEnabled || !data.settings.oddEven.anchorDate);
                    closeModal();
                    renderAll();
                    if (needOeCalibration) openOeCalibrationModal();
                    renderAll();
                });
            }

            // ============ 课程选择器弹窗（核心修复：切换周类型时自动保存备注） ============
            function openCoursePicker(day, slotIdx) {
                const oeEnabled = !!(data.settings.oddEven && data.settings.oddEven.enabled);
                const curView = getOddEvenView();
                const curWeekLabel = getCurrentWeekType() === 'even' ? '双周' : '单周';
                let activeSlot = '';
                {
                    const ents = getCellEntries(day, slotIdx);
                    if (ents.length) {
                        const match = (curView !== 'all') ? ents.find(e => e.weekType === curView) : null;
                        activeSlot = match ? match.weekType : (ents[0].weekType || '');
                    } else {
                        activeSlot = (oeEnabled && curView !== 'all') ? curView : '';
                    }
                }

                const noteOf = (wt) => {
                    const e = getCellEntries(day, slotIdx).find(x => x.weekType === wt);
                    return e ? (e.note || '') : '';
                };
                const cidOf = (wt) => {
                    const e = getCellEntries(day, slotIdx).find(x => x.weekType === wt);
                    return e ? e.cid : null;
                };
                const wtLabel = (wt) => wt === 'odd' ? '仅单周' : (wt === 'even' ? '仅双周' : '每周');

                // ---- 保存当前备注到当前槽位（核心修复：切换时先存再换） ----
                function saveCurrentNote() {
                    const ta = $('#cellNoteInput');
                    if (!ta) return;
                    const note = ta.value;
                    const ents = getCellEntries(day, slotIdx);
                    const idx = ents.findIndex(e => e.weekType === activeSlot);
                    if (idx >= 0) {
                        ents[idx].note = note;
                        setCellEntries(day, slotIdx, ents);
                    } else if (note.trim() && ents.length < 2) {
                        // 如果当前槽位无课程但备注不为空，且总条目<2，尝试创建一个临时条目（但不选课，只存备注？）
                        // 更稳妥：暂存到内存，用户选课时再合并。但为简化，直接忽略（用户需先选课再输备注）
                    }
                }

                // ---- 构建本格已排 chips ----
                const existingChips = () => {
                    const ents = getCellEntries(day, slotIdx);
                    if (!ents.length) return '<span class="slot-empty-hint">本格为空 · 在下方选择课程即可排入</span>';
                    return ents.map((e, i) => {
                        const c = getCourseById(e.cid);
                        const nm = c ? c.name : `#${e.cid}`;
                        const color = c ? c.color : '#999';
                        const isActive = oeEnabled && e.weekType === activeSlot;
                        return `
                            <span class="slot-chip ${isActive ? 'active' : ''}" data-wt="${e.weekType || ''}" data-idx="${i}" title="点击切换编辑到此条">
                                <i class="slot-chip-dot" style="background:${color};"></i>
                                <span class="slot-chip-name">${escapeHtml(nm)}</span>
                                ${e.weekType ? `<em class="slot-chip-wt">${wtLabel(e.weekType)}</em>` : ''}
                                <b class="slot-chip-del" data-idx="${i}" title="删除这条">×</b>
                            </span>`;
                    }).join('');
                };

                const cardsHtml = () => {
                    const curCid = cidOf(activeSlot);
                    return data.courses.map(c => `
                        <div class="picker-card ${curCid === c.id ? 'selected' : ''}" data-id="${c.id}" style="${curCid === c.id ? 'border-color:' + c.color + ';background:' + c.color + '15;' : ''}">
                            <div class="picker-color" style="background:${c.color};"></div>
                            <div class="picker-name">${c.name}</div>
                            ${c.teacher || c.classroom ? `<div class="picker-meta">${[c.teacher, c.classroom].filter(Boolean).join(' · ')}</div>` : ''}
                        </div>
                    `).join('');
                };

                const canSaveNote = () => {
                    const ents = getCellEntries(day, slotIdx);
                    if (!ents.length) return false;
                    if (!oeEnabled) return true;
                    if (activeSlot === '') return true;
                    return ents.some(e => e.weekType === activeSlot);
                };

                openModal(`
                    <div class="modal-header"><h3>选择课程 · ${DAY_NAMES[day]} ${data.timeSlots[slotIdx]?.name || ''}</h3><button class="modal-close">✕</button></div>
                    <div class="modal-body">
                        <div class="picker-existing">
                            <div class="picker-existing-label">本格已排 ${oeEnabled ? '（一格可排 单周+双周 两门）' : ''}</div>
                            <div class="picker-existing-list" id="slotChipList">${existingChips()}</div>
                            ${oeEnabled ? `<div style="font-size:0.65rem;color:var(--text-secondary);margin-top:6px;">💡 点击上方条目可切换编辑，点击 × 删除该条</div>` : ''}
                        </div>
                        <div class="picker-grid">
                            ${cardsHtml()}
                            <div class="picker-card add-card" id="btnAddNewCourseInPicker">
                                <div style="font-size:1.5rem;line-height:1;">+</div>
                                <div class="picker-name" style="font-size:0.75rem;">新增课程</div>
                            </div>
                            <div class="picker-card add-card" id="btnClearCell">
                                <div style="font-size:1.2rem;line-height:1;">✕</div>
                                <div class="picker-name" style="font-size:0.75rem;">清空单元格</div>
                            </div>
                        </div>
                        ${oeEnabled ? `
                        <div class="picker-cell-note" style="margin-top:10px;">
                            <label>这条课排到哪一周？<span id="slotActionTip" style="color:var(--text-secondary);font-weight:400;"></span></label>
                            <div class="weektype-seg" id="weekTypeSeg">
                                <button type="button" class="wt-btn ${activeSlot === '' ? 'active' : ''}" data-wt="">每周</button>
                                <button type="button" class="wt-btn ${activeSlot === 'odd' ? 'active' : ''}" data-wt="odd">仅单周</button>
                                <button type="button" class="wt-btn ${activeSlot === 'even' ? 'active' : ''}" data-wt="even">仅双周</button>
                            </div>
                            ${curView !== 'all' ? `<div class="picker-cell-note-tip" style="color:var(--text-secondary);">当前标题栏为"本周${curWeekLabel}"：只有${curWeekLabel}的课程会显示在课表上。如想同时查看/编辑另一周，可先点标题栏徽章切到"全部课程"。</div>` : ''}
                        </div>` : ''}
                        <div class="picker-cell-note">
                            <label for="cellNoteInput">本节备注 <span class="picker-cell-note-tip" style="display:inline;">（作用于当前编辑的这条课）</span></label>
                            <textarea id="cellNoteInput" rows="2" placeholder="如：单周 / 单:高一7 双:高一10 / 体育课改到操场">${escapeHtml(noteOf(activeSlot))}</textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn" id="btnPickerCancel">取消</button>
                        <button class="btn btn-primary" id="btnPickerSaveNote">保存备注</button>
                    </div>
                `, true);

                // ---- 同步UI ----
                function syncActiveUi() {
                    const ents = getCellEntries(day, slotIdx);
                    document.querySelectorAll('#weekTypeSeg .wt-btn').forEach(b => b.classList.toggle('active', b.dataset
                        .wt === activeSlot));
                    document.querySelectorAll('#slotChipList .slot-chip').forEach(ch => ch.classList.toggle('active', ch
                        .dataset.wt === activeSlot));
                    const ta = $('#cellNoteInput');
                    if (ta) ta.value = noteOf(activeSlot);
                    const curCid = cidOf(activeSlot);
                    document.querySelectorAll('.picker-card[data-id]').forEach(card => {
                        const sel = parseInt(card.dataset.id) === curCid;
                        card.classList.toggle('selected', sel);
                        card.style.borderColor = '';
                        card.style.background = '';
                        if (sel && curCid) {
                            const c = getCourseById(curCid);
                            if (c) { card.style.borderColor = c.color;
                                card.style.background = c.color + '15'; }
                        }
                    });
                    const tip = document.getElementById('slotActionTip');
                    if (tip) {
                        const targetIdx = ents.findIndex(e => e.weekType === activeSlot);
                        if (activeSlot === '') tip.textContent = ents.length ? '（设为每周：整格将合并为一门课）' : '';
                        else if (targetIdx >= 0) tip.textContent = '（将替换已有' + wtLabel(activeSlot) + '课程）';
                        else if (ents.length >= 2) tip.textContent = '';
                        else tip.textContent = '（将新增一条' + wtLabel(activeSlot) + '课程）';
                    }
                    const sv = $('#btnPickerSaveNote');
                    const ok = canSaveNote();
                    sv.disabled = !ok;
                    sv.style.opacity = ok ? '' : '0.5';
                    sv.style.cursor = ok ? '' : 'not-allowed';
                }

                // ---- 事件绑定 ----
                // 周类型切换：先保存当前备注，再切换
                document.querySelectorAll('#weekTypeSeg .wt-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        saveCurrentNote();
                        activeSlot = btn.dataset.wt || '';
                        syncActiveUi();
                    });
                });

                // slot-chip 点击切换槽位：先保存当前备注
                document.querySelectorAll('#slotChipList .slot-chip').forEach(chip => {
                    chip.addEventListener('click', (e) => {
                        if (e.target.closest('.slot-chip-del')) return;
                        saveCurrentNote();
                        activeSlot = chip.dataset.wt || '';
                        syncActiveUi();
                    });
                });

                // slot-chip 删除
                document.querySelectorAll('#slotChipList .slot-chip-del').forEach(del => {
                    del.addEventListener('click', (e) => {
                        e.stopPropagation();
                        // 删除前保存当前备注
                        saveCurrentNote();
                        removeCellEntryAt(day, slotIdx, parseInt(del.dataset.idx));
                        openCoursePicker(day, slotIdx);
                    });
                });

                // 提交课程
                function commitPick(cid) {
                    const note = ($('#cellNoteInput') ? $('#cellNoteInput').value : '') || '';
                    if (!oeEnabled || activeSlot === '') {
                        setCellEntries(day, slotIdx, [{ cid, note, weekType: '' }]);
                        closeModal();
                        return;
                    }
                    const ents = getCellEntries(day, slotIdx);
                    const idx = ents.findIndex(e => e.weekType === activeSlot);
                    if (idx >= 0) {
                        ents[idx] = { cid, note, weekType: activeSlot };
                    } else if (ents.length >= 2) {
                        alert('这一节最多放两门课（如：单周+双周）。请先点掉 "本格已排" 里其中一条再添加。');
                        return;
                    } else {
                        ents.push({ cid, note, weekType: activeSlot });
                    }
                    setCellEntries(day, slotIdx, ents);
                    closeModal();
                }

                document.querySelectorAll('.picker-card[data-id]').forEach(card => {
                    card.addEventListener('click', () => commitPick(parseInt(card.dataset.id)));
                });

                $('#btnAddNewCourseInPicker').addEventListener('click', () => {
                    openCourseLibraryModal(() => openCoursePicker(day, slotIdx));
                });

                $('#btnClearCell').addEventListener('click', () => {
                    setCellEntries(day, slotIdx, []);
                    closeModal();
                });

                $('#btnPickerSaveNote').addEventListener('click', () => {
                    const note = $('#cellNoteInput').value;
                    const ents = getCellEntries(day, slotIdx);
                    if (!ents.length) { closeModal(); return; }
                    if (!oeEnabled) { ents[0].note = note;
                        setCellEntries(day, slotIdx, ents);
                        closeModal(); return; }
                    if (activeSlot === '') {
                        const it = ents.find(e => e.weekType === '');
                        if (it) it.note = note;
                        else setCellEntries(day, slotIdx, [{ cid: ents[0].cid, note, weekType: '' }]);
                        closeModal();
                        return;
                    }
                    const idx = ents.findIndex(e => e.weekType === activeSlot);
                    if (idx >= 0) ents[idx].note = note;
                    setCellEntries(day, slotIdx, ents);
                    closeModal();
                });

                $('#btnPickerCancel').addEventListener('click', closeModal);

                // 初始同步
                syncActiveUi();
            }

            // ============ 课程库弹窗 ============
            function openCourseLibraryModal(onDone) {
                const renderLibraryList = () => {
                    const listHtml = data.courses.map(c => `
                        <div class="course-item" data-id="${c.id}">
                            <input type="color" class="course-color" data-id="${c.id}" value="${c.color}" title="颜色">
                            <div class="course-fields">
                                <div class="course-fields-row">
                                    <input type="text" class="name" data-id="${c.id}" value="${c.name}" placeholder="课程名称">
                                    <input type="text" data-field="teacher" data-id="${c.id}" value="${c.teacher}" placeholder="教师">
                                    <input type="text" data-field="classroom" data-id="${c.id}" value="${c.classroom}" placeholder="教室">
                                </div>
                                <div class="course-fields-row">
                                    <input type="text" data-field="note" data-id="${c.id}" value="${c.note}" placeholder="备注（可选）" style="flex:3;">
                                </div>
                            </div>
                            <button class="btn btn-danger btn-icon course-delete" data-id="${c.id}" title="删除">✕</button>
                        </div>
                    `).join('');

                    const paletteHtml = PRESET_COLORS.map(c =>
                        `<div class="color-swatch" data-color="${c}" style="background:${c};" title="${c}"></div>`).join('');

                    openModal(`
                        <div class="modal-header"><h3>课程库</h3><button class="modal-close">✕</button></div>
                        <div class="modal-body">
                            <p style="font-size:0.78rem;color:var(--text-secondary);margin-bottom:10px;">集中维护课程名称、颜色、教师、教室和备注，方便反复排课。</p>
                            <div class="course-list" id="libraryList">${listHtml}</div>

            // ============ 导出功能 ============
            function blobToBase64(blob) {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(String(reader.result).split(',')[1] || '');
                    reader.readAsDataURL(blob);
                });
            }

            async function saveExportFile(fileName, mime, source) {
                try {
                    if (window.AndroidBridge && typeof window.AndroidBridge.saveBase64 === 'function') {
                        let b64;
                        if (source instanceof Blob) b64 = await blobToBase64(source);
                        else if (typeof source === 'string' && source.indexOf('data:') === 0) b64 = source.split(',')[
                        1] || '';
                        else b64 = strToBase64(String(source));
                        window.AndroidBridge.saveBase64(b64, fileName, mime);
                        return;
                    }
                    let href, isBlobUrl = false;
                    if (source instanceof Blob) {
                        href = URL.createObjectURL(source);
                        isBlobUrl = true;
                    } else if (typeof source === 'string' && source.indexOf('data:') === 0) {
                        href = source;
                    } else {
                        href = URL.createObjectURL(new Blob([String(source)], { type: mime || 'text/plain' }));
                        isBlobUrl = true;
                    }
                    const link = document.createElement('a');
                    link.download = fileName;
                    link.href = href;
                    document.body.appendChild(link);
                    link.click();
                    link.remove();
                    if (isBlobUrl) setTimeout(() => URL.revokeObjectURL(href), 1000);
                } catch (e) {
                    alert('导出失败：' + (e && e.message ? e.message : e));
                }
            }

            function strToBase64(str) {
                const utf8 = new TextEncoder().encode(str);
                let bin = '';
                utf8.forEach(b => bin += String.fromCharCode(b));
                return btoa(bin);
            }

            const PRETTY_THEMES = {
                fresh: { name: '清新绿', bg1: '#f2faf0', bg2: '#ffffff', deco: '#a8d8b0', deco2: '#c9e8cf',
                    headerBg: '#8cc1b4', headerText: '#ffffff', titleColor: '#4a7c59', subColor: '#8fae9b',
                    band: '#eef7f0' },
                jungle: { name: '丛林风', bg1: '#eaf7e0', bg2: '#f8fdf4', deco: '#57a05a', deco2: '#8fc98a',
                    headerBg: '#5fae62', headerText: '#ffffff', titleColor: '#e0662e', subColor: '#7aa06e',
                    band: '#eaf6e6' },
                cream: { name: '奶油色', bg1: '#fdf6e9', bg2: '#fffdf8', deco: '#e0b98c', deco2: '#efd9ba',
                    headerBg: '#d99a6c', headerText: '#ffffff', titleColor: '#a4683a', subColor: '#b99a78',
                    band: '#faf3e8' }
            };

            function drawLeaf(ctx, x, y, len, angle, color) {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(angle);
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(len * 0.5, -len * 0.38, len, 0);
                ctx.quadraticCurveTo(len * 0.5, len * 0.38, 0, 0);
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.45)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(len * 0.12, 0);
                ctx.lineTo(len * 0.88, 0);
                ctx.stroke();
                ctx.restore();
            }

            function roundRectPath(ctx, x, y, w, h, r) {
                ctx.beginPath();
                ctx.moveTo(x + r, y);
                ctx.arcTo(x + w, y, x + w, y + h, r);
                ctx.arcTo(x + w, y + h, x, y + h, r);
                ctx.arcTo(x, y + h, x, y, r);
                ctx.arcTo(x, y, x + w, y, r);
                ctx.closePath();
            }

            function exportPrettyImage(themeKey) {
                const t = PRETTY_THEMES[themeKey] || PRETTY_THEMES.fresh;
                const rows = getExportData();
                const S = 2;
                const days = data.settings.daysPerWeek;
                const timeColW = 150,
                    colW = 185,
                    rowH = 72,
                    headerH = 60;
                const tableW = timeColW + days * colW;
                const tableH = headerH + rows.length * rowH;
                const padX = 80,
                    titleH = 210,
                    footH = 80;
                const W = Math.max(1240, tableW + padX * 2);
                const H = titleH + tableH + footH;
                const canvas = document.createElement('canvas');
                canvas.width = W * S;
                canvas.height = H * S;
                const ctx = canvas.getContext('2d');
                ctx.scale(S, S);

                const bg = ctx.createLinearGradient(0, 0, 0, H);
                bg.addColorStop(0, t.bg1);
                bg.addColorStop(1, t.bg2);
                ctx.fillStyle = bg;
                ctx.fillRect(0, 0, W, H);

                [
                    [34, 34, 115, -0.5, t.deco],
                    [100, 22, 90, -0.15, t.deco2],
                    [28, 125, 82, 0.35, t.deco2],
                    [W - 34, 38, 115, Math.PI + 0.5, t.deco],
                    [W - 105, 24, 88, Math.PI + 0.15, t.deco2],
                    [W - 28, 132, 82, Math.PI - 0.35, t.deco2],
                    [34, H - 42, 125, 0.6, t.deco],
                    [110, H - 26, 92, 0.2, t.deco2],
                    [W - 36, H - 46, 125, Math.PI - 0.6, t.deco],
                    [W - 115, H - 28, 92, Math.PI - 0.2, t.deco2]
                ].forEach(([x, y, len, ang, c]) => drawLeaf(ctx, x, y, len, ang, c));

                ctx.fillStyle = t.deco2;
                const avoidBands = [{ top: 0, bottom: 160 }, { top: H - 70, bottom: H }];
                for (let i = 0; i < 26; i++) {
                    let px, py, attempts = 0,
                        inBand;
                    do {
                        px = (i * 137 + 60 + attempts * 53) % (W - 40) + 20;
                        py = (i * 257 + 80 + attempts * 31) % (H - 60) + 30;
                        inBand = avoidBands.some(b => py >= b.top && py <= b.bottom);
                        attempts++;
                    } while (inBand && attempts < 20);
                    ctx.beginPath();
                    ctx.arc(px, py, 3.2, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.textAlign = 'center';
                ctx.fillStyle = t.titleColor;
                ctx.font = 'bold 54px sans-serif';
                ctx.fillText(data.title, W / 2, 96);
                if (data.subtitle && data.subtitle !== '点击添加备注...') {
                    ctx.fillStyle = t.subColor;
                    ctx.font = '22px sans-serif';
                    ctx.fillText(data.subtitle, W / 2, 134);
                }

                const tx = (W - tableW) / 2,
                    ty = titleH - 40;
                ctx.fillStyle = 'rgba(90,110,95,0.16)';
                roundRectPath(ctx, tx + 6, ty + 10, tableW, tableH, 18);
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                roundRectPath(ctx, tx, ty, tableW, tableH, 18);
                ctx.fill();
                ctx.save();
                roundRectPath(ctx, tx, ty, tableW, tableH, 18);
                ctx.clip();

                ctx.fillStyle = t.headerBg;
                ctx.fillRect(tx, ty, tableW, headerH);
                ctx.fillStyle = t.headerText;
                ctx.font = 'bold 24px sans-serif';
                ctx.fillText('节次', tx + timeColW / 2, ty + headerH / 2 + 8);
                for (let d = 0; d < days; d++) {
                    ctx.fillText(DAY_NAMES[d], tx + timeColW + d * colW + colW / 2, ty + headerH / 2 + 8);
                }

                rows.forEach((row, r) => {
                    const y = ty + headerH + r * rowH;
                    if (r % 2 === 1) { ctx.fillStyle = t.band;
                        ctx.fillRect(tx, y, tableW, rowH); }
                    ctx.strokeStyle = '#dfe9e2';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(tx, y, timeColW, rowH);
                    ctx.fillStyle = '#5b554b';
                    ctx.font = 'bold 20px sans-serif';
                    ctx.fillText(row.slot.name, tx + timeColW / 2, y + rowH / 2 - (data.settings.showTime ? 8 : 2));
                    if (data.settings.showTime) {
                        ctx.fillStyle = '#93a49a';
                        ctx.font = '15px sans-serif';
                        ctx.fillText(`${row.slot.start}-${row.slot.end}`, tx + timeColW / 2, y + rowH / 2 + 18);
                    }
                    if (row.slot.merged) {
                        const bx = tx + timeColW + 8,
                            bw = days * colW - 16;
                        const grad = ctx.createLinearGradient(bx, 0, bx + bw, 0);
                        grad.addColorStop(0, '#8cc1b455');
                        grad.addColorStop(1, '#9fc6d855');
                        ctx.fillStyle = grad;
                        roundRectPath(ctx, bx, y + 9, bw, rowH - 18, 10);
                        ctx.fill();
                        ctx.fillStyle = '#5b7a6e';
                        ctx.font = 'bold 19px sans-serif';
                        ctx.fillText(row.slot.name, tx + timeColW + (days * colW) / 2, y + rowH / 2 + 7);
                    } else {
                        for (let d = 0; d < days; d++) {
                            const cx = tx + timeColW + d * colW;
                            ctx.strokeRect(cx, y, colW, rowH);
                            const course = row.courses[d] ? getCourseById(row.courses[d]) : null;
                            if (course) {
                                ctx.fillStyle = course.color + '2e';
                                roundRectPath(ctx, cx + 7, y + 8, colW - 14, rowH - 16, 10);
                                ctx.fill();
                                ctx.fillStyle = '#4a443c';
                                let fs = 19;
                                ctx.font = `bold ${fs}px sans-serif`;
                                while (ctx.measureText(course.name).width > colW - 30 && fs > 12) { fs--;
                                    ctx.font = `bold ${fs}px sans-serif`; }
                                const meta = [course.classroom, course.teacher].filter(Boolean).join(' · ');
                                const note = getCellNote(d, r) || (course.note || '');
                                const line2 = meta || note;
                                const line3 = (meta && note) ? note : '';
                                const drawMeta = (txt, baseY) => {
                                    ctx.fillStyle = '#8b9a90';
                                    ctx.font = '13px sans-serif';
                                    let t = txt;
                                    while (ctx.measureText(t).width > colW - 26 && t.length > 2) t = t.slice(
                                        0, -2) + '…';
                                    ctx.fillText(t, cx + colW / 2, baseY);
                                };
                                if (line3) {
                                    ctx.fillText(course.name, cx + colW / 2 + 2, y + rowH / 2 - 13);
                                    drawMeta(line2, y + rowH / 2 + 4);
                                    drawMeta(line3, y + rowH / 2 + 19);
                                } else if (line2) {
                                    ctx.fillText(course.name, cx + colW / 2 + 2, y + rowH / 2 - 4);
                                    drawMeta(line2, y + rowH / 2 + 18);
                                } else {
                                    ctx.fillText(course.name, cx + colW / 2 + 2, y + rowH / 2 + 7);
                                }
                            }
                        }
                    }
                });
                ctx.restore();

                ctx.fillStyle = t.subColor;
                ctx.font = '14px sans-serif';
                ctx.fillText('极简课程表 · V3.2.1', W / 2, H - 34);

                saveExportFile(`${data.title}_课程表_精美.png`, 'image/png', canvas.toDataURL('image/png'));
            }

            function backupAllSchedules() {
                saveData();
                const schedules = scheduleIndex.list.map(item => {
                    let d = null;
                    try { d = JSON.parse(localStorage.getItem(schedKey(item.id)) || 'null'); } catch (e) {}
                    return d ? { id: item.id, name: item.name, data: d } : null;
                }).filter(Boolean);
                const payload = {
                    app: 'jibuli-kechengbiao',
                    type: 'backup',
                    version: 1,
                    exportedAt: new Date().toISOString(),
                    index: scheduleIndex,
                    schedules: schedules
                };
                const date = new Date().toISOString().slice(0, 10);
                saveExportFile(`课程表备份_${date}.json`, 'application/json', JSON.stringify(payload, null, 2));
            }

            function normalizeBackupPayload(payload) {
                if (!payload || typeof payload !== 'object' || !Array.isArray(payload.schedules) || !payload.schedules
                    .length) return null;
                if (payload.type === 'backup') {
                    if (!payload.index || !Array.isArray(payload.index.list)) return null;
                    return { exportedAt: payload.exportedAt, index: payload.index, schedules: payload.schedules };
                }
                if (payload.type === '极简课程表备份') {
                    return {
                        exportedAt: payload.exportedAt || payload.exportTime,
                        index: {
                            currentId: payload.currentId || payload.schedules[0].id,
                            list: payload.schedules.map(s => ({ id: s.id, name: s.name }))
                        },
                        schedules: payload.schedules
                    };
                }
                return null;
            }

            function restoreFromJson(text) {
                let payload;
                try { payload = JSON.parse(text); } catch (e) { alert('备份文件格式不正确'); return; }
                const norm = normalizeBackupPayload(payload);
                if (!norm) { alert('这不是本应用生成的备份文件，无法恢复'); return; }
                const when = norm.exportedAt ? new Date(norm.exportedAt).toLocaleString() : '未知时间';
                if (!confirm(`将恢复 ${norm.schedules.length} 张课表（备份于 ${when}），并覆盖当前全部课表数据。继续吗？`)) return;
                try {
                    localStorage.setItem(SCHEDULE_INDEX_KEY, JSON.stringify(norm.index));
                    const keep = new Set();
                    norm.schedules.forEach(s => {
                        const key = schedKey(s.id);
                        keep.add(key);
                        localStorage.setItem(key, JSON.stringify(s.data));
                    });
                    Object.keys(localStorage).forEach(k => {
                        if (k.indexOf('smartSchedulePro_v3_data_') === 0 && !keep.has(k)) localStorage
                            .removeItem(k);
                    });
                    location.reload();
                } catch (e) { alert('恢复失败：' + e.message); }
            }

                            <button class="btn" data-pretty="plain" style="flex:1;min-width:80px;padding:12px;font-size:0.8rem;">🤍 简约风</button>
                        </div>
                        <div style="border-top:1px dashed var(--border);margin:14px 0 10px;padding-top:12px;">
                            <p style="font-size:0.82rem;color:var(--text-secondary);margin-bottom:8px;">导出文档</p>
                            <div style="display:flex;gap:8px;flex-wrap:wrap;">
                                <button class="btn btn-primary" id="btnExportWord" style="flex:1;min-width:80px;padding:12px;font-size:0.8rem;">Word</button>
                                <button class="btn btn-primary" id="btnExportExcel" style="flex:1;min-width:80px;padding:12px;font-size:0.8rem;">Excel</button>
                            </div>
                        </div>
                        <div style="border-top:1px dashed var(--border);margin:14px 0 6px;padding-top:12px;">
                            <p style="font-size:0.82rem;color:var(--text-secondary);margin-bottom:8px;">数据备份（含全部课表，换手机/误删可恢复）</p>
                            <div style="display:flex;gap:8px;flex-wrap:wrap;">
                                <button class="btn" id="btnBackupData" style="flex:1;min-width:100px;padding:12px;font-size:0.8rem;">💾 备份全部课表</button>
                                <button class="btn" id="btnRestoreData" style="flex:1;min-width:100px;padding:12px;font-size:0.8rem;">📥 从备份恢复</button>
                            </div>
                        </div>
                    </div>
                `);
                $('#btnExportWord').addEventListener('click', () => { closeModal();
                    exportAsWord(); });
                $('#btnExportExcel').addEventListener('click', () => { closeModal();
                    exportAsExcel(); });
                modalContent.querySelectorAll('[data-pretty]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        closeModal();
                        if (btn.dataset.pretty === 'plain') exportAsImage();
                        else exportPrettyImage(btn.dataset.pretty);
                    });
                });
                $('#btnBackupData').addEventListener('click', () => { backupAllSchedules(); });
                $('#btnRestoreData').addEventListener('click', () => {
                    const inp = document.getElementById('restoreFileInput');
                    if (inp) inp.click();
                    else alert('当前环境不支持选择文件');
                });
            }

            function getExportData() {
                return data.timeSlots.map((slot, i) => ({
                    slot: slot,
                    courses: Array.from({ length: data.settings.daysPerWeek }, (_, d) => {
                        const e = getCellEntries(d, i);
                        return e.length ? e[0].cid : null;
                    })
                }));
            }

            function exportAsImage() {
                const rows = getExportData();
                const S = 3;
                const canvas = document.createElement('canvas');
                const colWidth = 180,
                    rowHeight = 68,
                    timeColWidth = 130,
                    headerHeight = 54,
                    titleHeight = 84;
                const totalW = timeColWidth + data.settings.daysPerWeek * colWidth;
                const totalH = titleHeight + headerHeight + rows.length * rowHeight;
                canvas.width = totalW * S;
                canvas.height = totalH * S;
                const ctx = canvas.getContext('2d');
                ctx.scale(S, S);
                const bg = getComputedStyle(document.documentElement).getPropertyValue('--card-bg').trim() || '#fbfdf9';
                const textColor = getComputedStyle(document.documentElement).getPropertyValue('--text').trim() ||
                    '#5b554b';
                const borderColor = getComputedStyle(document.documentElement).getPropertyValue('--border').trim() ||
                    '#d7e4db';
                const headerBg = data.settings.headerColor === 'auto' ? '#8cc1b4' : data.settings.headerColor;
                const titlebarBg = data.settings.titleColor === 'auto' ? '#8cc1b4' : data.settings.titleColor;

                ctx.fillStyle = bg;
                ctx.fillRect(0, 0, totalW, totalH);
                ctx.fillStyle = titlebarBg;
                ctx.fillRect(0, 0, totalW, titleHeight);
                ctx.fillStyle = '#fffdf8';
                ctx.textAlign = 'center';
                ctx.font = 'bold 28px sans-serif';
                ctx.fillText(data.title, totalW / 2, 40);
                if (data.subtitle && data.subtitle !== '点击添加备注...') {
                    ctx.font = '15px sans-serif';
                    ctx.fillStyle = 'rgba(255, 253, 248, 0.88)';
                    ctx.fillText(data.subtitle, totalW / 2, 68);
                }
                ctx.fillStyle = headerBg;
                ctx.fillRect(0, titleHeight, totalW, headerHeight);
                ctx.font = 'bold 16px sans-serif';
                ctx.fillStyle = '#fff';
                ctx.fillText('节次', timeColWidth / 2, titleHeight + headerHeight / 2 + 5);
                for (let d = 0; d < data.settings.daysPerWeek; d++) ctx.fillText(DAY_NAMES[d], timeColWidth + d *
                    colWidth + colWidth / 2, titleHeight + headerHeight / 2 + 5);

                ctx.strokeStyle = borderColor;
                ctx.lineWidth = 1;
                rows.forEach((row, rIdx) => {
                    const y = titleHeight + headerHeight + rIdx * rowHeight;
                    ctx.fillStyle = textColor;
                    ctx.textAlign = 'center';
                    ctx.font = 'bold 13px sans-serif';
                    if (data.settings.showTime) {
                        ctx.fillText(row.slot.name, timeColWidth / 2, y + rowHeight / 2);
                        ctx.font = '10px sans-serif';
                        ctx.fillStyle = '#8b9b8f';
                        ctx.fillText(`${row.slot.start}-${row.slot.end}`, timeColWidth / 2, y + rowHeight /
                            2 + 14);
                    } else {
                        ctx.fillText(row.slot.name, timeColWidth / 2, y + rowHeight / 2 + 1);
                    }
                    if (row.slot.merged) {
                        const bandX = timeColWidth + 2,
                            bandW = data.settings.daysPerWeek * colWidth - 4;
                        const grad = ctx.createLinearGradient(bandX, y, bandX + bandW, y);
                        grad.addColorStop(0, '#8cc1b455');
                        grad.addColorStop(1, '#9fc6d855');
                        ctx.fillStyle = grad;
                        ctx.fillRect(bandX, y + 2, bandW, rowHeight - 4);
                        ctx.fillStyle = '#5b7a6e';
                        ctx.font = 'bold 14px sans-serif';
                        ctx.fillText(row.slot.name, timeColWidth + (data.settings.daysPerWeek * colWidth) / 2,
                            y + rowHeight / 2 + 5);
                    } else {
                        for (let d = 0; d < data.settings.daysPerWeek; d++) {
                            const course = row.courses[d] ? getCourseById(row.courses[d]) : null;
                            const cx = timeColWidth + d * colWidth;
                            if (course) {
                                ctx.fillStyle = course.color + '22';
                                roundRectPath(ctx, cx + 4, y + 4, colWidth - 8, rowHeight - 8, 8);
                                ctx.fill();
                                ctx.fillStyle = course.color;
                                ctx.font = 'bold 15px sans-serif';
                                const meta = [course.classroom, course.teacher].filter(Boolean).join(' · ');
                                const note = getCellNote(d, rIdx) || (course.note || '');
                                const line2 = meta || note;
                                const line3 = (meta && note) ? note : '';
                                const drawSecond = (txt, baseY) => {
                                    ctx.font = '12px sans-serif';
                                    ctx.fillStyle = '#5b6961';
                                    let t = txt;
                                    while (ctx.measureText(t).width > colWidth - 26 && t.length > 2) t = t
                                        .slice(0, -2) + '…';
                                    ctx.fillText(t, cx + colWidth / 2, baseY);
                                };
                                if (line3) {
                                    ctx.fillText(course.name, cx + colWidth / 2, y + rowHeight / 2 - 13);
                                    drawSecond(line2, y + rowHeight / 2 + 4);
                                    drawSecond(line3, y + rowHeight / 2 + 19);
                                } else if (line2) {
                                    ctx.fillText(course.name, cx + colWidth / 2, y + rowHeight / 2 - 1);
                                    drawSecond(line2, y + rowHeight / 2 + 16);
                                } else {
                                    ctx.fillText(course.name, cx + colWidth / 2, y + rowHeight / 2 + 5);
                                }
                            }
                            ctx.strokeRect(cx, y, colWidth, rowHeight);
                        }
                    }
                    ctx.strokeRect(0, y, timeColWidth, rowHeight);
                });

                saveExportFile(`${data.title}_课程表.png`, 'image/png', canvas.toDataURL('image/png'));
            }

            function exportAsWord() {
                const rows = getExportData();
                const headerBg = data.settings.headerColor === 'auto' ? '#8cc1b4' : data.settings.headerColor;
                let html =
                    `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>${data.title}</title><style>
                    body{font-family:'微软雅黑',sans-serif;}table{border-collapse:collapse;width:100%;}th,td{border:1px solid #ccc;padding:8px;text-align:center;vertical-align:middle;}
                    th{background:${headerBg};color:#fff;font-weight:bold;}.time-col{background:#f5f5f5;font-size:11px;}.course-name{font-weight:bold;}.course-meta{font-size:10px;color:#666;}.course-note{font-size:10px;color:#888;font-style:italic;}
                </style></head><body>`;
                html += `<h2 style="text-align:center;">${data.title}</h2>`;
                if (data.subtitle && data.subtitle !== '点击添加备注...') html +=
                    `<p style="text-align:center;color:#888;">${data.subtitle}</p>`;
                html += `<table><tr><th>节次</th>`;
                for (let d = 0; d < data.settings.daysPerWeek; d++) html += `<th>${DAY_NAMES[d]}</th>`;
                html += `</tr>`;
                rows.forEach((row, rIdx) => {
                    html +=
                        `<tr><td class="time-col">${row.slot.name}<br>${data.settings.showTime ? row.slot.start + '-' + row.slot.end : ''}</td>`;
                    if (row.slot.merged) {
                        html += `<td class="merged-cell" colspan="${data.settings.daysPerWeek}">${row.slot.name}</td>`;
                    } else {
                        for (let d = 0; d < data.settings.daysPerWeek; d++) {
                            const course = row.courses[d] ? getCourseById(row.courses[d]) : null;
                            if (course) {
                                html += `<td><span class="course-name" style="color:${course.color};">${escapeHtml(course.name)}</span>`;
                                const meta = [course.classroom, course.teacher].filter(Boolean).join(' · ');
                                if (meta) html += `<br><span class="course-meta">${escapeHtml(meta)}</span>`;
                                const note = getCellNote(d, rIdx) || (course.note || '');
                                if (note) html += `<br><span class="course-note">${escapeHtml(note)}</span>`;
                                html += `</td>`;
                            } else html += `<td>&nbsp;</td>`;
                        }
                    }
                    html += `</tr>`;
                });
                html += `</table></body></html>`;
                const blob = new Blob(['\ufeff' + html], { type: 'application/msword' });
                saveExportFile(`${data.title}_课程表.doc`, 'application/msword', blob);
            }

            function exportAsExcel() {
                const rows = getExportData();
                const headerBg = data.settings.headerColor === 'auto' ? '#8cc1b4' : data.settings.headerColor;
                let html =
                    `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>${data.title}</title><style>
                    table{border-collapse:collapse;}th,td{border:1px solid #999;padding:6px;text-align:center;}th{background:${headerBg};color:#fff;font-weight:bold;}.time-col{background:#f0f0f0;}
                </style></head><body>`;
                html += `<h3>${data.title}</h3>`;
                html += `<table><tr><th>节次</th>`;
                for (let d = 0; d < data.settings.daysPerWeek; d++) html += `<th>${DAY_NAMES[d]}</th>`;
                html += `</tr>`;
                rows.forEach((row, rIdx) => {
                    html +=
                        `<tr><td class="time-col">${row.slot.name}${data.settings.showTime ? ' ' + row.slot.start + '-' + row.slot.end : ''}</td>`;
                    if (row.slot.merged) {
                        html += `<td colspan="${data.settings.daysPerWeek}">${row.slot.name}</td>`;
                    } else {
                        for (let d = 0; d < data.settings.daysPerWeek; d++) {
                            const course = row.courses[d] ? getCourseById(row.courses[d]) : null;
                            if (course) {
                                let cell = course.name;
                                if (course.classroom) cell += `\n${course.classroom}`;
                                if (course.teacher) cell += `\n${course.teacher}`;
                                const note = getCellNote(d, rIdx) || (course.note || '');
                                if (note) cell += `\n备注：${note}`;
                                html += `<td>${escapeHtml(cell).replace(/\n/g, '<br>')}</td>`;
                            } else html += `<td></td>`;
                        }
                    }
                    html += `</tr>`;
                });
                html += `</table></body></html>`;
                const blob = new Blob(['\ufeff' + html], { type: 'application/vnd.ms-excel' });
                saveExportFile(`${data.title}_课程表.xls`, 'application/vnd.ms-excel', blob);
            }

            // ============ 右键/长按菜单 ============
            function showContextMenu(x, y, day, slotIdx) {
                const ents = getCellEntries(day, slotIdx);
                let html;
                if (!ents.length) {
                    html = `<div class="context-menu-item" data-action="add">添加课程</div>`;
                } else if (ents.length === 1) {
                    html =
                        `<div class="context-menu-item" data-action="edit">✏️ 编辑课程</div><div class="context-menu-item danger" data-action="delete">🗑️ 删除课程</div>`;
                } else {
                    html =
                        `<div class="context-menu-item" data-action="edit">✏️ 编辑本节（单周+双周）</div><div class="context-menu-item danger" data-action="delete">🗑️ 清空本节</div>`;
                }
                contextMenu.innerHTML = html;
                contextMenu.style.left = Math.min(x, window.innerWidth - 160) + 'px';
                contextMenu.style.top = Math.min(y, window.innerHeight - 100) + 'px';
                contextMenu.classList.add('active');

                contextMenu.querySelectorAll('.context-menu-item').forEach(item => {
                    item.addEventListener('click', () => {
                        const action = item.dataset.action;
                        contextMenu.classList.remove('active');
                        if (action === 'add' || action === 'edit') openCoursePicker(day, slotIdx);
                        else if (action === 'delete') setCellEntries(day, slotIdx, []);
                    });
                });
            }

            // ============ 全局事件 ============
            document.addEventListener('click', (e) => { if (!e.target.closest('.context-menu')) contextMenu.classList
                    .remove('active'); });
            document.addEventListener('scroll', () => contextMenu.classList.remove('active'));

            titleInput.addEventListener('change', () => { data.title = titleInput.value.trim() || '我的课程表';
                syncCurrentScheduleName();
                saveData(); });
            const oeChipEl = document.getElementById('oeChip');
            if (oeChipEl) oeChipEl.addEventListener('click', () => {
                const oe = data.settings.oddEven;
                if (oe && oe.enabled && !oe.anchorDate) { openOeCalibrationModal(); return; }
                cycleOddEvenView();
            });
            titleInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') titleInput.blur(); });
            subtitleInput.addEventListener('change', () => { data.subtitle = subtitleInput.value.trim() ||
                    '点击添加备注...';
                saveData(); });
            subtitleInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') subtitleInput.blur(); });

            $('#btnSettings').addEventListener('click', openSettingsModal);
            $('#btnSchedules').addEventListener('click', openScheduleManager);
            $('#btnLibrary').addEventListener('click', () => openCourseLibraryModal());
            $('#btnTemplates').addEventListener('click', openTemplatesModal);
            $('#btnBatch').addEventListener('click', openBatchModal);
            $('#btnExport').addEventListener('click', openExportModal);
            $('#restoreFileInput').addEventListener('change', (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => restoreFromJson(String(reader.result));
                reader.readAsText(file);
                e.target.value = '';
            });
            $('#btnClear').addEventListener('click', () => {
                if (confirm('确定要清空所有课程数据吗？此操作不可撤销！')) {
                    if (confirm('再次确认：将清空所有课程安排，但保留课程库和设置。继续？')) {
                        data.schedule = {};
                        renderAll();
                    }
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') { closeModal();
                    contextMenu.classList.remove('active'); }
            });

            // ============ 当前时间 ============
            let _lastOeWeekKey = '';

            function updateDateTime() {
                const now = new Date();
                const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
                const dateStr =
                    `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
                const timeStr =
                    `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
                if (currentTimeText) currentTimeText.textContent = `星期${weekdays[now.getDay()]} ${dateStr} ${timeStr}`;
                const oe = data.settings.oddEven;
                if (oe && oe.enabled) {
                    const monday = getMondayOf(now);
                    const wkKey = `${monday.getFullYear()}-${monday.getMonth()}-${monday.getDate()}`;
                    if (wkKey !== _lastOeWeekKey) {
                        if (_lastOeWeekKey) { renderHeader();
                            renderTable(); }
                        _lastOeWeekKey = wkKey;
                    }
                }
            }
            updateDateTime();
            setInterval(updateDateTime, 1000);

            // ============ 初始化 ============
            renderAll();
            console.log('📚 智能课程表 V3.2.1 已加载');
            console.log('💾 数据自动保存到本地');
            console.log('📱 点击单元格选课 · 长按/右键弹出菜单');
            console.log('✏️ 切换单双周时备注自动保存 · 单双周视图下备注正常显示');
        })();
    </script>
<script>
// 源码保护：禁止右键查看/查看源代码/开发者工具（不影响正常使用）
document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
document.addEventListener('keydown', function(e) {
    if (e.ctrlKey && (e.key === 'u' || e.key === 's' || e.key === 'U' || e.key === 'S')) {
        e.preventDefault();
    }
    if (e.key === 'F12') { e.preventDefault(); }
    if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) {
        e.preventDefault();
    }
});
</script>
