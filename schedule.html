<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>课程表 - 智能排课工具</title>
    <style>
        :root {
            --bg: #eef4f0;
            --card-bg: #fbfdf9;
            --text: #5b554b;
            --text-secondary: #8b9b8f;
            --border: #d7e4db;
            --primary: #8cc1b4;
            --primary-hover: #79b3a5;
            --primary-light: rgba(140, 193, 180, 0.15);
            --danger: #e7a78c;
            --danger-hover: #dc9678;
            --info: #9fc6d8;
            --info-hover: #8ab9cd;
            --warning: #f0c98f;
            --shadow: 0 1px 8px rgba(120, 130, 120, 0.07);
            --shadow-lg: 0 6px 22px rgba(120, 130, 120, 0.12);
            --radius: 14px;
            --radius-sm: 8px;
            --transition: 0.2s ease;
            --header-bg: #8cc1b4;
            --header-text: #fffdf8;
            --cell-hover: #eef4f0;
            --time-col-bg: #f3f8f4;
            --section-label-bg: #e6f0ec;
            --weekend-bg: #f5faf6;
            --modal-overlay: rgba(100, 120, 110, 0.28);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #2c322d;
                --card-bg: #383d39;
                --text: #e8ece9;
                --text-secondary: #aab6ab;
                --border: #4d5650;
                --shadow: 0 1px 8px rgba(0, 0, 0, 0.22);
                --shadow-lg: 0 6px 22px rgba(0, 0, 0, 0.30);
                --cell-hover: #444b45;
                --time-col-bg: #404641;
                --section-label-bg: #474d48;
                --weekend-bg: #343a35;
                --modal-overlay: rgba(0, 0, 0, 0.48);
            }
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }
        .app-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px 16px 20px;
        }

        /* ===== 顶部标题栏 ===== */
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background: var(--titlebar-bg, var(--primary));
            color: var(--header-text);
            border-radius: 12px;
            box-shadow: 0 2px 10px rgba(120, 150, 130, 0.14);
            margin-bottom: 12px;
            position: sticky;
            top: 8px;
            z-index: 100;
        }
        .header-top {
            display: flex;
            align-items: center;
            flex: 1 1 100%;
            gap: 8px;
            min-width: 0;
        }
        .header-title-area {
            flex: 1 1 auto;
            min-width: 0;
            display: flex;
            flex-direction: row;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
        }
        .header-title {
            font-size: 1.25rem;
            font-weight: 700;
            border: none;
            background: none;
            color: var(--header-text);
            padding: 2px 4px;
            border-radius: var(--radius-sm);
            transition: var(--transition);
            width: auto;
            text-align: left;
            outline: none;
            min-width: 0;
            flex: 0 1 auto;
        }
        .header-title:hover {
            background: rgba(255, 253, 248, 0.10);
        }
        .header-title:focus {
            background: rgba(255, 253, 248, 0.12);
            box-shadow: 0 0 0 2px rgba(255, 253, 248, 0.35);
        }
        .header-subtitle {
            font-size: 0.78rem;
            color: rgba(255, 253, 248, 0.88);
            border: none;
            background: rgba(255, 253, 248, 0.15);
            padding: 2px 8px;
            border-radius: var(--radius-sm);
            width: auto;
            min-width: 80px;
            text-align: left;
            outline: none;
            transition: var(--transition);
            letter-spacing: 0.2px;
            flex: 0 1 auto;
        }
        .header-subtitle:hover {
            background: rgba(255, 253, 248, 0.22);
        }
        .header-subtitle:focus {
            background: rgba(255, 253, 248, 0.28);
            box-shadow: 0 0 0 2px rgba(255, 253, 248, 0.35);
        }
        .header-subtitle::placeholder {
            color: rgba(255, 253, 248, 0.65);
        }

        .header-time {
            font-size: 0.75rem;
            color: #4d6258;
            white-space: nowrap;
            padding: 5px 10px;
            background: rgba(251, 253, 249, 0.88);
            border-radius: var(--radius-sm);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            letter-spacing: 0.3px;
            flex-shrink: 0;
            line-height: 1.4;
            box-shadow: 0 1px 4px rgba(100, 120, 110, 0.08);
        }
        .header-time-meta {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            line-height: 1;
            width: 100%;
        }
        .version-badge {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--header-text, #fff);
            background: var(--titlebar-bg, var(--primary, #8cc1b4));
            padding: 2px 6px;
            border-radius: 8px;
            letter-spacing: 0.4px;
            white-space: nowrap;
        }
        .edit-hint {
            font-size: 0.65rem;
            color: #6b7f73;
            white-space: nowrap;
            letter-spacing: 0.2px;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }
        .edit-hint svg {
            width: 12px;
            height: 12px;
            flex-shrink: 0;
        }

        .oe-chip {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--header-text, #fff);
            background: var(--titlebar-bg, var(--primary, #8cc1b4));
            padding: 2px 6px;
            border-radius: 8px;
            letter-spacing: 0.4px;
            white-space: nowrap;
            cursor: pointer;
            border: none;
            user-select: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .oe-chip:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18);
        }
        .oe-chip.oe-view-all {
            background-image: linear-gradient(rgba(0, 0, 0, 0.22), rgba(0, 0, 0, 0.22));
        }
        .oe-chip.oe-view-other {
            background-image: linear-gradient(rgba(0, 0, 0, 0.42), rgba(0, 0, 0, 0.42));
        }
        .week-tag {
            font-size: 0.50rem;
            font-weight: 700;
            line-height: 1;
            color: #fff;
            background: rgba(0, 0, 0, 0.30);
            padding: 1px 4px;
            border-radius: 5px;
            flex-shrink: 0;
            margin-left: 2px;
            letter-spacing: 0.2px;
        }
        .course-cell .course-name-row {
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 100%;
            min-width: 0;
        }
        .course-cell .course-name-row .course-name {
            min-width: 0;
        }
        .weektype-seg {
            display: inline-flex;
            border: 1px solid var(--border-color, #d8cfc0);
            border-radius: 9px;
            overflow: hidden;
            background: #fff;
        }
        .weektype-seg .wt-btn {
            border: none;
            background: transparent;
            padding: 5px 12px;
            font-size: 0.75rem;
            color: var(--text-secondary, #6b7f73);
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
        }
        .weektype-seg .wt-btn+.wt-btn {
            border-left: 1px solid var(--border-color, #d8cfc0);
        }
        .weektype-seg .wt-btn.active {
            background: #d98e5f;
            color: #fff;
            font-weight: 700;
        }
        .weektype-seg .wt-btn:not(.active):hover {
            background: rgba(217, 142, 95, 0.12);
        }

        .header-buttons {
            display: flex;
            gap: 5px;
            flex-wrap: nowrap;
            align-items: center;
            flex: 1 1 100%;
            margin-top: 0;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .header-buttons::-webkit-scrollbar {
            display: none;
        }
        .header-buttons .btn {
            flex-shrink: 0;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: var(--transition);
            background: var(--section-label-bg);
            color: var(--text);
            white-space: nowrap;
            text-decoration: none;
            line-height: 1.4;
        }
        .btn:hover {
            background: var(--cell-hover);
            transform: translateY(-1px);
        }
        .btn:active {
            transform: translateY(0);
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--primary-hover);
        }
        .btn-danger {
            background: var(--danger);
            color: #fff;
        }
        .btn-danger:hover {
            background: var(--danger-hover);
        }
        .btn-info {
            background: var(--info);
            color: #fff;
        }
        .btn-info:hover {
            background: var(--info-hover);
        }
        .btn-sm {
            padding: 5px 10px;
            font-size: 0.75rem;
        }
        .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }
        .btn-icon {
            padding: 6px 8px;
        }
        .btn-icon svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }
        .header .btn {
            background: rgba(255, 253, 248, 0.22);
            color: var(--header-text);
            border: 1px solid rgba(255, 253, 248, 0.25);
        }
        .header .btn:hover {
            background: rgba(255, 253, 248, 0.32);
        }
        .header .btn-primary {
            background: rgba(255, 253, 248, 0.35);
            color: var(--header-text);
        }
        .header .btn-primary:hover {
            background: rgba(255, 253, 248, 0.45);
        }
        .header .btn-danger {
            background: rgba(231, 167, 140, 0.85);
            color: #fff;
            border-color: rgba(231, 167, 140, 0.90);
        }
        .header .btn-danger:hover {
            background: rgba(220, 150, 120, 0.95);
        }

        .toolbar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
            padding: 8px 14px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 12px;
        }
        .toolbar .btn {
            padding: 7px 12px;
            font-size: 0.82rem;
        }
        .toolbar-spacer {
            flex: 1;
            min-width: 8px;
        }

        .schedule-wrapper {
            overflow-x: auto;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            -webkit-overflow-scrolling: touch;
        }
        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 680px;
            table-layout: fixed;
        }
        .schedule-table th,
        .schedule-table td {
            border: 1px solid var(--border);
            text-align: center;
            vertical-align: middle;
            padding: 0;
            position: relative;
        }
        .schedule-table th {
            background: var(--header-bg);
            color: var(--header-text);
            font-weight: 600;
            font-size: 0.82rem;
            padding: 7px 4px;
            letter-spacing: 0.3px;
        }
        .schedule-table th.day-header {
            min-width: 70px;
        }
        .schedule-table th.day-header.weekend {
            background: var(--section-label-bg);
            color: var(--text-secondary);
        }

        .time-col {
            background: var(--time-col-bg);
            font-size: 0.7rem;
            color: var(--text-secondary);
            padding: 6px 4px !important;
            min-width: 65px;
            cursor: default;
            transition: var(--transition);
            line-height: 1.35;
        }
        .time-col .period-name {
            font-weight: 700;
            font-size: 0.78rem;
            color: var(--text);
            display: block;
            margin-bottom: 2px;
        }
        .time-col .period-name-edit {
            cursor: pointer;
            border-bottom: 1px dashed transparent;
            transition: all 0.15s;
            display: block;
        }
        .time-col .period-name-edit:hover {
            color: var(--primary);
            border-color: var(--primary);
        }
        .time-col .period-time {
            display: block;
            font-size: 0.65rem;
        }
        .time-col .period-time-edit {
            cursor: pointer;
            transition: all 0.15s;
            display: block;
            font-variant-numeric: tabular-nums;
        }
        .time-col .period-time-edit:hover {
            color: var(--primary);
        }

        .merged-cell {
            background: linear-gradient(135deg, rgba(140, 193, 180, 0.18), rgba(159, 198, 216, 0.18));
            text-align: center;
            vertical-align: middle;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 2px;
            padding: 6px 4px !important;
        }
        .merged-cell .merged-icon {
            margin-right: 4px;
            opacity: 0.7;
        }

        .sched-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 8px 10px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color, #e3ece6);
            margin-bottom: 8px;
            background: var(--card-bg);
        }
        .sched-row.active {
            border-color: var(--primary);
            background: rgba(140, 193, 180, 0.10);
        }
        .sched-info {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }
        .sched-name-input {
            flex: 1;
            min-width: 0;
            border: 1px solid transparent;
            background: transparent;
            font-weight: 600;
            color: var(--text);
            font-size: 0.85rem;
            padding: 3px 6px;
            border-radius: 4px;
        }
        .sched-name-input:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
        }
        .sched-current-tag {
            flex-shrink: 0;
            font-size: 0.65rem;
            font-weight: 700;
            color: #fff;
            background: var(--primary);
            padding: 2px 7px;
            border-radius: 999px;
        }
        .sched-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        .sched-new-row {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .sched-new-row input {
            flex: 1;
            min-width: 0;
        }

        /* ===== 单元格样式（无删除按钮） ===== */
        .course-cell {
            cursor: pointer;
            transition: var(--transition);
            padding: 0 3px;
            min-height: 46px;
            position: relative;
            background: var(--card-bg);
            touch-action: manipulation;
        }
        .course-cell:hover {
            background: var(--cell-hover);
            box-shadow: inset 0 0 0 2px var(--primary);
        }
        .course-cell.filled {
            cursor: pointer;
        }
        .course-cell .course-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 0 6px;
            border-radius: var(--radius-sm);
            min-height: 46px;
            height: 100%;
            transition: var(--transition);
        }
        .course-cell .course-name {
            font-weight: 700;
            font-size: 0.8rem;
            line-height: 1.2;
            word-break: break-word;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .course-cell .course-meta {
            font-size: 0.65rem;
            opacity: 0.9;
            line-height: 1.2;
            word-break: break-word;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .course-cell .course-note {
            font-size: 0.55rem;
            opacity: 0.75;
            line-height: 1.1;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .course-cell .add-placeholder {
            color: var(--text-secondary);
            font-size: 1rem;
            opacity: 0;
            transition: var(--transition);
        }
        .course-cell:hover .add-placeholder {
            opacity: 0.5;
        }
        .course-cell.weekend-cell {
            background: var(--weekend-bg);
        }

        /* 多条目布局（仅当 visibleEntries > 1 时，隐藏备注） */
        .course-cell.multi-entry {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 0;
            padding: 1px 3px;
        }
        .course-cell.multi-entry .course-content {
            flex: 1 1 0;
            min-height: 0;
            height: auto;
            padding: 0 4px;
            gap: 0;
        }
        .course-cell.multi-entry .course-name {
            font-size: 0.72rem;
        }
        .course-cell.multi-entry .course-meta {
            font-size: 0.58rem;
        }
        .course-cell.multi-entry .course-note {
            display: none;  /* 多条时隐藏备注 */
        }
        .course-cell.multi-entry .entry-divider {
            flex-shrink: 0;
            height: 1px;
            margin: 0 6px;
            background: repeating-linear-gradient(90deg, transparent 0, transparent 3px, rgba(0, 0, 0, 0.18) 3px, rgba(0, 0, 0, 0.18) 6px);
        }

        .picker-cell-note {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px dashed var(--border);
        }
        .picker-cell-note label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .picker-cell-note textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 0.85rem;
            resize: vertical;
            box-sizing: border-box;
            background: var(--card-bg);
            color: var(--text);
        }
        .picker-cell-note-tip {
            font-size: 0.72rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .picker-existing {
            margin-bottom: 12px;
        }
        .picker-existing-label {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .picker-existing-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }
        .slot-empty-hint {
            font-size: 0.75rem;
            color: var(--text-secondary);
            opacity: 0.7;
        }
        .slot-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            border-radius: 14px;
            padding: 3px 8px 3px 5px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: var(--transition);
            user-select: none;
        }
        .slot-chip.active {
            border-color: var(--primary);
            box-shadow: 0 0 0 1px var(--primary);
        }
        .slot-chip .slot-chip-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
            display: inline-block;
        }
        .slot-chip-name {
            font-weight: 600;
            color: var(--text);
        }
        .slot-chip-wt {
            font-style: normal;
            font-size: 0.62rem;
            font-weight: 700;
            color: #fff;
            background: var(--primary);
            border-radius: 8px;
            padding: 1px 5px;
            line-height: 1.4;
        }
        .slot-chip-del {
            font-style: normal;
            color: var(--danger);
            cursor: pointer;
            font-size: 0.85rem;
            line-height: 1;
            padding: 0 1px 0 2px;
            border-radius: 50%;
            font-weight: 700;
        }
        .slot-chip-del:hover {
            background: rgba(231, 76, 60, 0.15);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--modal-overlay);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 12px;
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 620px;
            max-height: 92vh;
            overflow: hidden;
            animation: slideUp 0.25s ease;
            padding: 0;
            display: flex;
            flex-direction: column;
        }
        .modal.wide {
            max-width: 860px;
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 18px 12px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: var(--card-bg);
            z-index: 5;
            border-radius: var(--radius) var(--radius) 0 0;
            flex-shrink: 0;
        }
        .modal-header h3 {
            font-size: 1.05rem;
            font-weight: 700;
        }
        .modal-close {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            background: var(--section-label-bg);
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            transition: var(--transition);
            flex-shrink: 0;
        }
        .modal-close:hover {
            background: var(--danger);
            color: #fff;
        }
        .modal-body {
            padding: 16px 18px;
            overflow-y: auto;
            flex: 1 1 auto;
        }
        .modal-footer {
            padding: 10px 18px 16px;
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            border-top: 1px solid var(--border);
            position: sticky;
            bottom: 0;
            background: var(--card-bg);
            flex-wrap: wrap;
        }

                    if (lunchAfter > 0 && i === lunchAfter) startMin += lunchDuration;
                    const endMin = startMin + duration;
                    slots.push({ name: `第${i + 1}节`, start: formatTime(startMin), end: formatTime(endMin), merged: false });
                    if (i < count - 1) {
                        if (!(lunchAfter > 0 && i === lunchAfter - 1)) startMin = endMin + breakMin;
                        else startMin = endMin;
                    }
                }
                return slots;
            }

                    ],

            };

            // ============ 默认数据 ============
            function getDefaultData() {
                return {
                    title: '我的课程表',
                    subtitle: '点击添加备注...',
                    settings: {
                        daysPerWeek: 5,
                        showTime: true,
                        headerColor: 'auto',
                        titleColor: 'auto',
                        auto: { firstStartTime: '08:30', periodDuration: 40, breakDuration: 10, lunchAfterPeriod: 4,
                            lunchDuration: 120 },
                        oddEven: { enabled: false, anchorDate: '', anchorType: 'odd', viewOverride: null }
                    },
                    timeSlots: generateSlots(6, '08:30', 40, 10, 4, 120),
                    courses: [
                        { id: 1, name: '语文', color: '#FF6B6B', teacher: '', classroom: '', note: '' },
                        { id: 2, name: '数学', color: '#54A0FF', teacher: '', classroom: '', note: '' },
                        { id: 3, name: '英语', color: '#10AC84', teacher: '', classroom: '', note: '' },
                        { id: 4, name: '物理', color: '#FECA57', teacher: '', classroom: '', note: '' },
                        { id: 5, name: '化学', color: '#0ABDE3', teacher: '', classroom: '', note: '' },
                        { id: 6, name: '体育', color: '#FF9F43', teacher: '', classroom: '', note: '' }
                    ],
                    schedule: {},
                    nextCourseId: 7
                };
            }

            // ============ 状态 ============
            const SCHEDULE_INDEX_KEY = 'smartSchedulePro_v3_index';
            const schedKey = (id) => 'smartSchedulePro_v3_data_' + id;

            function loadScheduleIndex() {
                try {
                    const raw = localStorage.getItem(SCHEDULE_INDEX_KEY);
                    if (raw) {
                        const idx = JSON.parse(raw);
                        if (idx && Array.isArray(idx.list) && idx.list.length && idx.currentId) return idx;
                    }
                } catch (e) { console.warn('读取课表索引失败', e); }
                let firstData = null;
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (parsed && parsed.timeSlots && parsed.courses) firstData = parsed;
                        else if (parsed && parsed.settings && parsed.courses) firstData = migrateData(parsed);
                    }
                } catch (e) {}
                if (!firstData) firstData = getDefaultData();
                const id = 's' + Date.now();
                try { localStorage.setItem(schedKey(id), JSON.stringify(firstData)); } catch (e) {}
                const idx = { currentId: id, list: [{ id, name: firstData.title || '我的课表' }] };
                try { localStorage.setItem(SCHEDULE_INDEX_KEY, JSON.stringify(idx)); } catch (e) {}
                return idx;
            }

            function loadScheduleData(id) {
                try {
                    const saved = localStorage.getItem(schedKey(id));
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (parsed && (parsed.timeSlots || parsed.settings) && parsed.courses) {
                            return migrateData(parsed);
                        }
                    }
                } catch (e) { console.warn('加载课表数据失败', e); }
                return getDefaultData();
            }

            function normalizeSchedule(schedule) {
                if (!schedule) return;
                Object.keys(schedule).forEach(k => {
                    const v = schedule[k];
                    if (v == null) { delete schedule[k]; return; }
                    if (typeof v === 'number') schedule[k] = [{ cid: v, note: '', weekType: '' }];
                    else if (!Array.isArray(v)) schedule[k] = [{ cid: v.cid || null, note: v.note || '', weekType: v
                            .weekType || '' }];
                });
            }

            let scheduleIndex = loadScheduleIndex();
            let currentScheduleId = scheduleIndex.currentId;
            let data = loadScheduleData(currentScheduleId);

            function saveData() {
                try { localStorage.setItem(schedKey(currentScheduleId), JSON.stringify(data)); } catch (e) { console
                        .warn('保存数据失败', e); }
            }

            function saveScheduleIndex() {
                try { localStorage.setItem(SCHEDULE_INDEX_KEY, JSON.stringify(scheduleIndex)); } catch (e) { console
                        .warn('保存课表索引失败', e); }
            }

            function migrateData(parsed) {
                if (!parsed.timeSlots) {
                    const s = parsed.settings || {};
                    const auto = {
                        firstStartTime: s.firstStartTime || '08:30',
                        periodDuration: s.periodDuration || 40,
                        breakDuration: s.breakDuration || 10,
                        lunchAfterPeriod: s.lunchAfterPeriod || 0,
                        lunchDuration: s.lunchDuration || 120
                    };
                    parsed.settings.auto = auto;
                    parsed.timeSlots = generateSlots(
                        s.periodsPerDay || 6,
                        auto.firstStartTime,
                        auto.periodDuration,
                        auto.breakDuration,
                        auto.lunchAfterPeriod,
                        auto.lunchDuration
                    );
                }
                if (parsed.timeSlots) {
                    parsed.timeSlots.forEach(slot => { if (typeof slot.merged !== 'boolean') slot.merged = false; });
                }
                if (!parsed.courses && parsed.subjects) {
                    parsed.courses = parsed.subjects.map((s, idx) => ({
                        id: s.id || idx + 1,
                        name: s.name,
                        color: s.color,
                        teacher: '',
                        classroom: '',
                        note: ''
                    }));
                    parsed.nextCourseId = parsed.nextSubjectId || (parsed.courses.length + 1);
                }
                if (!parsed.subtitle && parsed.note) parsed.subtitle = parsed.note;
                parsed.settings = parsed.settings || getDefaultData().settings;
                if (!parsed.settings.auto) {
                    parsed.settings.auto = { firstStartTime: '08:30', periodDuration: 40, breakDuration: 10,
                        lunchAfterPeriod: 0, lunchDuration: 120 };
                }
                if (!parsed.settings.oddEven) {
                    parsed.settings.oddEven = { enabled: false, anchorDate: '', anchorType: 'odd', viewOverride: null };
                }
                normalizeSchedule(parsed.schedule);
                return parsed;
            }

            // ============ 工具函数 ============
            function escapeHtml(str) {
                return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;',
                    "'": '&#39;' }[m]));
            }

            function formatTime(totalMinutes) {
                const h = Math.floor(totalMinutes / 60);
                const m = totalMinutes % 60;
                return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
            }

            function parseTime(timeStr) {
                const [h, m] = timeStr.split(':').map(Number);
                return h * 60 + m;
            }

            function getCourseById(id) { return data.courses.find(c => c.id === id); }

            function _normalizeEntries(raw) {
                if (raw == null) return [];
                if (Array.isArray(raw)) return raw.filter(e => e && e.cid != null).map(e => ({ cid: e.cid, note: e.note ||
                        '', weekType: e.weekType || '' }));
                const r = { cid: raw.cid != null ? raw.cid : null, note: raw.note || '', weekType: raw.weekType || '' };
                return r.cid != null ? [{ cid: r.cid, note: r.note || '', weekType: r.weekType || '' }] : [];
            }

            function getCellEntries(dayIdx, slotIdx) { return _normalizeEntries(data.schedule[`${dayIdx}-${slotIdx}`]); }

            function getCellNote(dayIdx, slotIdx) { const e = getCellEntries(dayIdx, slotIdx); return e.length ? e[0].note :
                    ''; }

            function setCellEntries(dayIdx, slotIdx, entries) {
                const key = `${dayIdx}-${slotIdx}`;
                const valid = (entries || []).filter(e => e && e.cid != null).map(e => ({ cid: e.cid, note: e.note || '',
                    weekType: e.weekType || '' }));
                if (valid.length === 0) delete data.schedule[key];
                else data.schedule[key] = valid;
                saveData();
                renderTable();
            }

            function removeCellEntryAt(dayIdx, slotIdx, idx) {
                const entries = getCellEntries(dayIdx, slotIdx);
                if (idx < 0 || idx >= entries.length) return;
                entries.splice(idx, 1);
                if (!entries.length) delete data.schedule[`${dayIdx}-${slotIdx}`];
                else data.schedule[`${dayIdx}-${slotIdx}`] = entries;
                saveData();
                renderTable();
            }

            // ============ 单双周 ============
            function getMondayOf(d) {
                const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
                x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
                return x;
            }

            function getCurrentWeekType() {
                const oe = data.settings.oddEven;
                if (!oe || !oe.enabled || !oe.anchorDate) return null;
                const anchor = getMondayOf(new Date(oe.anchorDate + 'T00:00:00'));
                const now = getMondayOf(new Date());
                const diff = Math.round((now - anchor) / (7 * 24 * 3600 * 1000));
                const anchorIsOdd = oe.anchorType !== 'even';
                const sameParity = ((diff % 2) + 2) % 2 === 0;
                return (sameParity === anchorIsOdd) ? 'odd' : 'even';
            }

            function getOddEvenView() {
                const oe = data.settings.oddEven;
                if (!oe || !oe.enabled) return 'all';
                if (oe.viewOverride === 'all') return 'all';
                if (oe.viewOverride === 'other') {
                    const cur = getCurrentWeekType();
                    return cur ? (cur === 'odd' ? 'even' : 'odd') : 'all';
                }
                return getCurrentWeekType() || 'all';
            }

            function cycleOddEvenView() {
                const oe = data.settings.oddEven;
                if (!oe || !oe.enabled) return;
                const cur = oe.viewOverride || 'auto';
                oe.viewOverride = cur === 'auto' ? 'all' : (cur === 'all' ? 'other' : null);
                saveData();
                renderHeader();
                renderTable();
            }

            function setOddEvenAnchor(type) {
                const monday = getMondayOf(new Date());
                const iso =
                `${monday.getFullYear()}-${String(monday.getMonth()+1).padStart(2,'0')}-${String(monday.getDate()).padStart(2,'0')}`;
                data.settings.oddEven.enabled = true;
                data.settings.oddEven.anchorDate = iso;
                data.settings.oddEven.anchorType = type;
                data.settings.oddEven.viewOverride = null;
                saveData();
                renderAll();
                closeModal();
            }

            function openOeCalibrationModal() {
                openModal(`
                    <div class="modal-header"><h3>校准单双周</h3><button class="modal-close">✕</button></div>
                    <div class="modal-body">
                        <p style="font-size:0.85rem;margin-bottom:4px;">请选择<strong>本周</strong>是单周还是双周：</p>
                        <p style="font-size:0.72rem;color:var(--text-secondary);">选定后每周一自动交替，无需再记。也可以先把整张课表排完，再回来校准。</p>
                        <div style="display:flex;gap:10px;justify-content:center;margin-top:16px;">
                            <button class="btn btn-primary" id="oeCalOdd" style="min-width:120px;">本周 = 单周</button>
                            <button class="btn btn-primary" id="oeCalEven" style="min-width:120px;">本周 = 双周</button>
                        </div>
                        <p style="margin-top:14px;font-size:0.7rem;color:var(--text-secondary);">之后如需重新校准或关闭：标题栏周次徽章，或 设置 → 单双周模式。</p>
                    </div>
                `);
                $('#oeCalOdd').addEventListener('click', () => setOddEvenAnchor('odd'));
                $('#oeCalEven').addEventListener('click', () => setOddEvenAnchor('even'));
            }

            function updateOeChip() {
                const chip = document.getElementById('oeChip');
                if (!chip) return;
                const oe = data.settings.oddEven;
                if (!oe || !oe.enabled) { chip.style.display = 'none'; return; }
                chip.style.display = '';
                chip.classList.remove('oe-view-all', 'oe-view-other');
                if (!oe.anchorDate) {
                    chip.textContent = '点击校准单双周';
                    chip.title = '单双周模式已开启，点击选择本周是单周还是双周（排完课表后再校准也可以）';
                    return;
                }
                const cur = getCurrentWeekType();
                const curLabel = cur === 'even' ? '双周' : '单周';
                const other = cur === 'even' ? '单周' : '双周';
                if (!oe.viewOverride || oe.viewOverride === 'auto') {
                    chip.textContent = `本周${curLabel}`;
                    chip.title = '单双周模式已开启，当前自动跟随本周。点击：显示全部课程';
                } else if (oe.viewOverride === 'all') {
                    chip.textContent = '全部课程';
                    chip.classList.add('oe-view-all');
                    chip.title = '正在显示全部课程（含单双周）。点击：预览' + other;
                } else {
                    chip.textContent = '预览' + other;
                    chip.classList.add('oe-view-other');
                    chip.title = '正在预览' + other + '课程。点击：恢复跟随本周';
                }
            }

            // ============ DOM引用 ============
            const $ = (sel) => document.querySelector(sel);
            const titleInput = $('#titleInput');
            const subtitleInput = $('#subtitleInput');
            const currentTimeText = $('#currentTimeText');
            const tableHead = $('#tableHead');
            const tableBody = $('#tableBody');
            const modalOverlay = $('#modalOverlay');
            const modalContent = $('#modalContent');
            const contextMenu = $('#contextMenu');

            // ============ 渲染 ============
            function renderAll() { renderHeader();
                renderTable();
                saveData();
                scheduleAutoFit(); }

            // 单元格文字自适应（保留原字体大小风格）
            function autoFitCourseCells() {
                const targets = document.querySelectorAll('.course-cell .course-name, .course-cell .course-meta');
                if (!targets.length) return;
                targets.forEach(el => { el.style.fontSize = ''; });
                targets.forEach(el => {
                    if (!el.textContent.trim()) return;
                    const cell = el.parentElement;
                    if (!cell || !cell.clientWidth) return;
                    const row = el.closest('.course-name-row');
                    const tagExtra = (row && row.querySelector('.week-tag')) ? 10 : 0;
                    const maxW = cell.clientWidth - 4 - tagExtra;
                    const cs = getComputedStyle(el);
                    let fs = parseFloat(cs.fontSize) || 12;
                    el.style.fontSize = fs + 'px';
                    let guard = 0;
                    while (el.scrollWidth > maxW && fs > 8 && guard < 40) {
                        fs -= 0.5;
                        el.style.fontSize = fs + 'px';
                        guard++;
                    }
                });
            }

            function scheduleAutoFit() {
                if (window.__autoFitRaf) cancelAnimationFrame(window.__autoFitRaf);
                window.__autoFitRaf = requestAnimationFrame(() => {
                    window.__autoFitRaf = null;
                    autoFitCourseCells();
                });
            }
            window.addEventListener('resize', scheduleAutoFit);
            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(scheduleAutoFit);
            } else {
                setTimeout(scheduleAutoFit, 200);
            }

            function renderHeader() {
                titleInput.value = data.title;
                subtitleInput.value = data.subtitle;
                const hc = data.settings.headerColor === 'auto' ? '#8cc1b4' : data.settings.headerColor;
                document.documentElement.style.setProperty('--header-bg', hc);
                const tc = data.settings.titleColor && data.settings.titleColor !== 'auto' ? data.settings.titleColor : null;
                if (tc) document.documentElement.style.setProperty('--titlebar-bg', tc);
                else document.documentElement.style.removeProperty('--titlebar-bg');
                updateOeChip();
            }

            function renderTable() {
                const s = data.settings;
                const dayCount = s.daysPerWeek;
                const oeView = getOddEvenView();

                let headHtml = '<tr><th style="min-width:55px;">节次</th>';
                for (let d = 0; d < dayCount; d++) {
                    const isWeekend = d >= 5;
                    headHtml += `<th class="day-header ${isWeekend ? 'weekend' : ''}">${DAY_NAMES[d]}</th>`;
                }
                headHtml += '</tr>';
                tableHead.innerHTML = headHtml;

                let bodyHtml = '';
                data.timeSlots.forEach((slot, slotIdx) => {
                    bodyHtml += '<tr>';
                    const timeRange = s.showTime ? `${slot.start}-${slot.end}` : '';
                    bodyHtml += `
                        <td class="time-col">
                            <span class="period-name period-name-edit" data-slot="${slotIdx}">${slot.name}</span>
                            ${timeRange ? `<span class="period-time period-time-edit" data-slot="${slotIdx}">${timeRange}</span>` : ''}
                        </td>
                    `;
                    if (slot.merged) {
                        bodyHtml +=
                            `<td class="merged-cell" colspan="${dayCount}">${escapeHtml(slot.name)}</td>`;
                    } else {
                        for (let d = 0; d < dayCount; d++) {
                            const entries = getCellEntries(d, slotIdx);
                            const visibleEntries = entries.filter(e => !e.weekType || oeView === 'all' || e
                            .weekType === oeView);
                            const isWeekend = d >= 5;
                            // 关键：只有可见条目数量 > 1 时才应用 multi-entry 样式（隐藏备注）
                            const isMulti = visibleEntries.length > 1;
                            const cellCls =
                                `course-cell ${visibleEntries.length ? 'filled' : ''} ${isMulti ? 'multi-entry' : ''} ${isWeekend ? 'weekend-cell' : ''}`;

                            const renderEntry = (e, idx) => {
                                const course = getCourseById(e.cid);
                                if (!course) return '';
                                const bgColor = course.color;
                                const metaParts = [];
                                if (course.classroom) metaParts.push(course.classroom);
                                if (course.teacher) metaParts.push(course.teacher);
                                const metaText = metaParts.join(' · ');
                                const noteText = e.note || course.note || '';
                                const weekTag = e.weekType ?
                                    `<span class="week-tag" title="${e.weekType === 'odd' ? '仅单周显示' : '仅双周显示'}">${e.weekType === 'odd' ? '单' : '双'}</span>` :
                                    '';
                                return `
                                    <div class="course-content${noteText ? ' three-lines' : ''}" style="background:${bgColor}22;">
                                        <div class="course-name-row"><span class="course-name" style="color:${bgColor};" title="${escapeHtml(course.name)}${metaText ? '\n' + escapeHtml(metaText) : ''}${noteText ? '\n' + escapeHtml(noteText) : ''}">${course.name}</span>${weekTag}</div>
                                        ${metaText ? `<span class="course-meta" title="${escapeHtml(metaText)}">${metaText}</span>` : ''}
                                        ${noteText ? `<span class="course-note" title="${escapeHtml(noteText)}">${escapeHtml(noteText)}</span>` : ''}
                                    </div>
                                `;
                            };

                            const innerHtml = visibleEntries.length ?
                                visibleEntries.map(renderEntry).join('<div class="entry-divider"></div>') :
                                (entries.length ? '<span class="add-placeholder" title="本节存在另一周课程，本周无课">+</span>' :
                                    '<span class="add-placeholder">+</span>');
                            bodyHtml += `
                                <td class="${cellCls}" data-day="${d}" data-slot="${slotIdx}" style="cursor:pointer;">
                                    ${innerHtml}
                                </td>
                            `;
                        }
                    }
                    bodyHtml += '</tr>';
                });
                tableBody.innerHTML = bodyHtml;
                bindTableEvents();
            }

            // ---- 长按检测（手机端） ----
            let longPressTimer = null;
            let longPressTriggered = false;

            function startLongPress(cell, clientX, clientY) {
                longPressTriggered = false;
                const day = parseInt(cell.dataset.day);
                const slot = parseInt(cell.dataset.slot);
                longPressTimer = setTimeout(() => {
                    longPressTriggered = true;
                    showContextMenu(clientX, clientY, day, slot);
                }, 500);
            }

            function cancelLongPress() {
                if (longPressTimer) { clearTimeout(longPressTimer);
                    longPressTimer = null; }
            }

            function bindTableEvents() {
                // 所有单元格：单击 = 选课弹窗，长按 = 菜单
                tableBody.querySelectorAll('.course-cell').forEach(cell => {
                    // 单击
                    cell.addEventListener('click', (e) => {
                        if (longPressTriggered) {
                            longPressTriggered = false;
                            return;
                        }
                        const day = parseInt(cell.dataset.day);
                        const slot = parseInt(cell.dataset.slot);
                        openCoursePicker(day, slot);
                    });

                    // 右键（桌面）
                    cell.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        const day = parseInt(cell.dataset.day);
                        const slot = parseInt(cell.dataset.slot);
                        showContextMenu(e.clientX, e.clientY, day, slot);
                    });

                    // 长按（手机）
                    cell.addEventListener('touchstart', (e) => {
                        const touch = e.touches[0];
                        startLongPress(cell, touch.clientX, touch.clientY);
                    }, { passive: true });

                    cell.addEventListener('touchmove', (e) => {
                        cancelLongPress();
                    }, { passive: true });

                    cell.addEventListener('touchend', (e) => {
                        cancelLongPress();
                    }, { passive: true });

                    cell.addEventListener('touchcancel', () => {
                        cancelLongPress();
                    }, { passive: true });
                });

                // 节次编辑
                tableBody.querySelectorAll('.period-time-edit').forEach(el => {
                    el.addEventListener('click', (e) => {
                        e.stopPropagation();
                        openSlotEditor(parseInt(el.dataset.slot));
                    });
                });
                tableBody.querySelectorAll('.period-name-edit').forEach(el => {
                    el.addEventListener('click', (e) => {
                        e.stopPropagation();
                        openSlotEditor(parseInt(el.dataset.slot));
                    });
                });
            }

            // ============ 节次编辑 ============
            function openSlotEditor(slotIdx) {
                const slot = data.timeSlots[slotIdx];
                const isFirst = slotIdx === 0;
                const isLast = slotIdx === data.timeSlots.length - 1;
                openModal(`
                    <div class="modal-header"><h3>编辑节次 · ${escapeHtml(slot.name)}</h3><button class="modal-close">✕</button></div>
                    <div class="modal-body">
                        <div class="form-group"><label>节次名称</label><input type="text" id="editSlotName" value="${escapeHtml(slot.name)}"></div>
                        <div class="form-row">
                            <div class="form-group"><label>开始时间</label><input type="time" id="editStart" value="${slot.start}"></div>
                            <div class="form-group"><label>结束时间</label><input type="time" id="editEnd" value="${slot.end}"></div>
                        </div>
                        <div class="form-group checkbox-group" style="padding-bottom:8px;">
                            <input type="checkbox" id="editMerged" ${slot.merged ? 'checked' : ''}>
                            <label for="editMerged">合并为一整行（课间操 / 眼保健操 / 午休等整行活动）</label>
                        </div>
                        <div class="form-group" style="font-size:0.72rem;color:var(--text-secondary);">提示：合并后该节次不安排课程，星期部分显示为一整行。</div>
                    </div>
                    <div class="modal-footer" style="justify-content:space-between;">
                        <div style="display:flex;gap:6px;">
                            <button class="btn btn-sm" id="btnSlotUp" ${isFirst ? 'disabled' : ''} title="上移">↑ 上移</button>
                            <button class="btn btn-sm" id="btnSlotDown" ${isLast ? 'disabled' : ''} title="下移">↓ 下移</button>
                        </div>
                        <div style="display:flex;gap:6px;">
                            <button class="btn" id="btnCancelTime">取消</button>
                            <button class="btn btn-primary" id="btnSaveTime">保存</button>
                        </div>
                    </div>
                `);
                $('#btnCancelTime').addEventListener('click', closeModal);
                $('#btnSaveTime').addEventListener('click', () => {
                    data.timeSlots[slotIdx].name = $('#editSlotName').value.trim() || '节次';
                    data.timeSlots[slotIdx].start = $('#editStart').value;
                    data.timeSlots[slotIdx].end = $('#editEnd').value;
                    data.timeSlots[slotIdx].merged = $('#editMerged').checked;
                    saveData();
                    renderTable();
                    closeModal();
                });
                $('#btnSlotUp')?.addEventListener('click', () => moveSlot(slotIdx, -1));
                $('#btnSlotDown')?.addEventListener('click', () => moveSlot(slotIdx, 1));
            }

            function moveSlot(idx, dir) {
                const target = idx + dir;
                const slots = data.timeSlots;
                if (target < 0 || target >= slots.length) return;
                [slots[idx], slots[target]] = [slots[target], slots[idx]];
                const renamed = {};
                Object.keys(data.schedule).forEach(key => {
                    const m = key.match(/^(\d+)-(\d+)$/);
                    if (!m) { renamed[key] = data.schedule[key]; return; }
                    const si = parseInt(m[2]);
                    if (si === idx) renamed[`${m[1]}-${target}`] = data.schedule[key];
                    else if (si === target) renamed[`${m[1]}-${idx}`] = data.schedule[key];
                    else renamed[key] = data.schedule[key];
                });
                data.schedule = renamed;
                saveData();
                renderTable();
                openSlotEditor(target);
            }

            // ============ 弹窗系统 ============
            let _modalOutsideHandler = null;

            function openModal(html, wide) {
                if (_modalOutsideHandler) {
                    modalOverlay.removeEventListener('click', _modalOutsideHandler);
                }
                modalContent.innerHTML = html;
                modalContent.classList.toggle('wide', !!wide);
                modalOverlay.classList.add('active');
                modalOverlay.querySelector('.modal-close')?.addEventListener('click', closeModal);
                _modalOutsideHandler = (e) => { if (e.target === modalOverlay) closeModal(); };
                modalOverlay.addEventListener('click', _modalOutsideHandler);
            }

            function closeModal() {
                modalOverlay.classList.remove('active');
                modalContent.innerHTML = '';
            }

            // ============ 多课表操作 ============
            function switchSchedule(id) {
                if (id === currentScheduleId) { closeModal(); return; }
                saveData();
                currentScheduleId = id;
                scheduleIndex.currentId = id;
                saveScheduleIndex();
                data = loadScheduleData(id);
                renderAll();
                closeModal();
            }

            function createSchedule(name, fromData) {
                const id = 's' + Date.now();
                const d = fromData ? JSON.parse(JSON.stringify(fromData)) : getDefaultData();
                d.title = name;
                try { localStorage.setItem(schedKey(id), JSON.stringify(d)); } catch (e) {}
                scheduleIndex.list.push({ id, name });
                saveScheduleIndex();
                return id;
            }

            function renameSchedule(id, newName) {
                const item = scheduleIndex.list.find(s => s.id === id);
                if (!item || !newName.trim()) return;
                item.name = newName.trim();
                if (id === currentScheduleId) {
                    data.title = item.name;
                    saveData();
                    renderHeader();
                }
                saveScheduleIndex();
            }

            function syncCurrentScheduleName() {
                const item = scheduleIndex.list.find(s => s.id === currentScheduleId);
                if (item && item.name !== data.title) {
                    item.name = data.title;
                    saveScheduleIndex();
                }
            }

            function deleteSchedule(id) {
                if (scheduleIndex.list.length <= 1) return;
                const pos = scheduleIndex.list.findIndex(s => s.id === id);
                if (pos < 0) return;
                scheduleIndex.list.splice(pos, 1);
                try { localStorage.removeItem(schedKey(id)); } catch (e) {}
                if (currentScheduleId === id) {
                    currentScheduleId = scheduleIndex.list[0].id;
                    scheduleIndex.currentId = currentScheduleId;
                    data = loadScheduleData(currentScheduleId);
                    saveScheduleIndex();
                    renderAll();
                } else {
                    saveScheduleIndex();
                }
            }

            function openScheduleManager() {
                const rows = scheduleIndex.list.map(item => `
                    <div class="sched-row ${item.id === currentScheduleId ? 'active' : ''}">
                        <div class="sched-info">
                            <input class="sched-name-input" data-id="${item.id}" value="${escapeHtml(item.name)}" spellcheck="false" title="点击重命名">
                            ${item.id === currentScheduleId ? '<span class="sched-current-tag">当前</span>' : ''}
                        </div>
                        <div class="sched-actions">
                            ${item.id === currentScheduleId ? '' : `<button class="btn btn-sm" data-act="switch" data-id="${item.id}">切换</button>`}
                            <button class="btn btn-sm btn-danger" data-act="delete" data-id="${item.id}" ${scheduleIndex.list.length <= 1 ? 'disabled' : ''}>删除</button>
                        </div>
                    </div>`).join('');
                openModal(`
                    <div class="modal-header"><h3>多课表管理</h3><button class="modal-close">✕</button></div>
                    <div class="modal-body">
                        <div style="font-size:0.75rem;color:var(--text-secondary);margin-bottom:10px;">适合家里多个孩子各用一张课表：每张课表拥有独立的标题、节次时间、课程库和排课，互不影响。点击名称可直接重命名。</div>
                        ${rows}
                        <div class="sched-new-row">
                            <input type="text" id="newSchedName" placeholder="新课表名称，如：哥哥·三年级" spellcheck="false">
                            <button class="btn btn-primary" id="btnNewSchedule">＋ 新建</button>
                        </div>
                        <button class="btn" id="btnCopySchedule" style="margin-top:8px;">📋 复制当前课表（名称自动加"副本"）</button>
                    </div>
                `, true);
                modalContent.querySelectorAll('.sched-name-input').forEach(inp => {
                    inp.addEventListener('change', () => renameSchedule(inp.dataset.id, inp.value));
                    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') inp.blur(); });
                });
                modalContent.querySelectorAll('[data-act="switch"]').forEach(btn => {
                    btn.addEventListener('click', () => switchSchedule(btn.dataset.id));
                });
                modalContent.querySelectorAll('[data-act="delete"]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const item = scheduleIndex.list.find(s => s.id === btn.dataset.id);
                        if (!item) return;
                        if (!confirm(`确定删除课表「${item.name}」吗？该课表的全部排课、课程库将一并删除，不可恢复。`))
                            return;
                        deleteSchedule(btn.dataset.id);
                        if (modalOverlay.classList.contains('active')) openScheduleManager();
                    });
                });
                $('#btnNewSchedule')?.addEventListener('click', () => {
                    const name = $('#newSchedName').value.trim() || '新课表';
                    const id = createSchedule(name, null);
                    switchSchedule(id);
                });
                $('#btnCopySchedule')?.addEventListener('click', () => {
                    const cur = scheduleIndex.list.find(s => s.id === currentScheduleId);
                    const id = createSchedule((cur ? cur.name : '我的课表') + ' 副本', data);
                    switchSchedule(id);
                });
            }

            // ============ 课程设置弹窗 ============
            function openSettingsModal() {
                const s = data.settings;
                if (!s.oddEven) s.oddEven = { enabled: false, anchorDate: '', anchorType: 'odd', viewOverride: null };
                const auto = s.auto || { firstStartTime: '08:30', periodDuration: 40, breakDuration: 10,
                    lunchAfterPeriod: 0, lunchDuration: 120 };
                const oe = s.oddEven;
                const _curWT = getCurrentWeekType();
                const oeStatusText = oe.enabled && oe.anchorDate ?
                    `本周是「${_curWT === 'even' ? '双周' : '单周'}」，校准于 ${oe.anchorDate}` :
                    '';
                const lunchOptions = ['<option value="0" ' + (auto.lunchAfterPeriod === 0 ? 'selected' : '') + '>不午休</option>'];
                const maxPeriod = 16;
                for (let i = 1; i <= maxPeriod; i++) {
                    lunchOptions.push(`<option value="${i}" ${auto.lunchAfterPeriod === i ? 'selected' : ''}>第${i}节后</option>`);
